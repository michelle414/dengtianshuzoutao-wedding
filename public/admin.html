<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>邓天澍 & 邹涛｜宾客管理</title>

  <style>
    @font-face {
      font-family: "WeddingChinese";
      src: url("/FZZiLSJW-B.TTF") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "WeddingEnglish";
      src: url("/FZVDLGTMCJW-L.TTF") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ef;
      color: #403831;
      font-family: "WeddingChinese", serif;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       登录
    ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(120, 100, 80, 0.14);
      border-radius: 18px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(70, 50, 30, 0.08);
    }

    .login-en {
      font-family: "WeddingEnglish", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-bottom: 10px;
    }

    .login-title {
      font-size: 25px;
      font-weight: normal;
      margin: 0 0 28px;
    }

    .login-input {
      width: 100%;
      height: 48px;
      border: 1px solid #d7cec4;
      border-radius: 10px;
      background: #fff;
      padding: 0 14px;
      text-align: center;
      font-size: 15px;
      outline: none;
    }

    .login-input:focus {
      border-color: #9e9082;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #51483f;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
    }

    .login-error {
      margin-top: 14px;
      min-height: 40px;
      color: #a05252;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* =========================
       后台
    ========================= */

    .admin-page {
      display: none;
    }

    .page {
      width: min(100%, 780px);
      margin: 0 auto;
      padding: 26px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 15px;
    }

    .header-en {
      font-family: "WeddingEnglish", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-bottom: 7px;
    }

    .header-title {
      font-size: 26px;
      font-weight: normal;
      margin: 0;
    }

    .logout {
      border: 1px solid #d4cbc1;
      background: transparent;
      color: #625950;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* =========================
       添加宾客
    ========================= */

    .add-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .add-title {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .guest-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #d7cec4;
      border-radius: 9px;
      background: white;
      padding: 0 13px;
      outline: none;
      font-size: 15px;
    }

    .add-button {
      height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #51483f;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .message {
      min-height: 20px;
      margin-top: 9px;
      font-size: 13px;
      color: #806f5e;
      line-height: 1.5;
    }

    /* =========================
       发送人
    ========================= */

    .sender-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .sender-title {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .sender-desc {
      font-size: 12px;
      color: #8b7f74;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .sender-select {
      width: 100%;
      height: 46px;
      border: 1px solid #d7cec4;
      border-radius: 9px;
      background: white;
      padding: 0 12px;
      color: #403831;
      font-size: 14px;
      outline: none;
    }

    /* =========================
       数据
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 18px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(120, 100, 80, 0.1);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.6;
    }

    .stat-number {
      margin-top: 3px;
      font-family: "WeddingEnglish", serif;
      font-size: 24px;
    }

    /* =========================
       区域标题
    ========================= */

    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 26px 2px 10px;
    }

    .section-label-title {
      font-size: 16px;
    }

    .section-label-en {
      font-family: "WeddingEnglish", serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      opacity: 0.45;
    }

    /* =========================
       宾客卡片
    ========================= */

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 15px;
      padding: 17px;
    }

    .guest-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .guest-name {
      font-size: 20px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.sent {
      background: #e8eee7;
      color: #5c7159;
    }

    .status.unsent {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .guest-link {
      margin-top: 9px;
      font-family: "WeddingEnglish", serif;
      font-size: 11px;
      color: #81766d;
      word-break: break-all;
      line-height: 1.5;
      opacity: 0.8;
    }

    /* =========================
       回复状态
    ========================= */

    .reply-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #faf8f4;
      border: 1px solid #eee8df;
    }

    .reply-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .reply-status.replied {
      background: #e8eee7;
      color: #5c7159;
    }

    .reply-status.waiting {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .reply-detail {
      font-size: 13px;
      line-height: 1.8;
      color: #5c544d;
    }

    .reply-detail strong {
      font-weight: normal;
      color: #403831;
    }

    .reply-message {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #e9e2d9;
      color: #766b62;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       操作按钮
    ========================= */

    .actions {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      min-height: 42px;
      border: 1px solid #d8d0c6;
      background: white;
      color: #5c544d;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 10px;
    }

    .actions .primary {
      background: #51483f;
      color: white;
      border-color: #51483f;
    }

    .actions .danger {
      color: #a05252;
    }

    .actions .delete {
      grid-column: 1 / -1;
      background: transparent;
      border-color: transparent;
      color: #a05252;
      min-height: 34px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #8c8177;
      font-size: 14px;
    }

    /* =========================
       微信邀请预览
    ========================= */

    .invite-preview {
      margin-top: 14px;
      padding: 14px;
      background: #faf8f4;
      border: 1px solid #eee8df;
      border-radius: 12px;
    }

    .invite-preview-title {
      font-size: 12px;
      color: #8a7d72;
      margin-bottom: 8px;
    }

    .invite-preview-text {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid #ddd5cb;
      border-radius: 9px;
      background: white;
      padding: 12px;
      color: #51483f;
      font-size: 13px;
      line-height: 1.7;
      outline: none;
    }

    .invite-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .invite-preview-actions button {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #d8d0c6;
      background: white;
      color: #5c544d;
      cursor: pointer;
      font-size: 13px;
    }

    .invite-preview-actions .main-copy {
      background: #51483f;
      border-color: #51483f;
      color: white;
    }

    @media (max-width: 620px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 22px 14px 40px;
      }

      .add-row {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .header-title {
        font-size: 23px;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .actions .primary {
        grid-column: 1 / -1;
      }

      .actions .delete {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       登录
  ========================= -->

  <section class="login-page" id="loginPage">

    <div class="login-card">

      <div class="login-en">
        WEDDING ADMIN
      </div>

      <h1 class="login-title">
        宾客管理
      </h1>

      <input
        id="passwordInput"
        class="login-input"
        type="password"
        placeholder="请输入管理员密码"
        autocomplete="current-password"
      />

      <button
        id="loginButton"
        class="login-button"
      >
        进入管理页面
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </section>


  <!-- =========================
       管理后台
  ========================= -->

  <section
    id="adminPage"
    class="admin-page"
  >

    <div class="page">

      <header class="header">

        <div>
          <div class="header-en">
            TIANSHU & TAO
          </div>

          <h1 class="header-title">
            宾客管理
          </h1>
        </div>

        <button
          id="logoutButton"
          class="logout"
        >
          退出
        </button>

      </header>


      <!-- =========================
           添加宾客
      ========================= -->

      <div class="add-card">

        <div class="add-title">
          添加宾客
        </div>

        <div class="add-row">

          <input
            id="guestNameInput"
            class="guest-input"
            type="text"
            placeholder="输入宾客姓名，例如：邹小明"
          />

          <button
            id="addGuestButton"
            class="add-button"
          >
            添加宾客
          </button>

        </div>

        <div
          id="message"
          class="message"
        ></div>

      </div>


      <!-- =========================
           发送人
      ========================= -->

      <div class="sender-card">

        <div class="sender-title">
          谁来发这份邀请？
        </div>

        <div class="sender-desc">
          选择后，系统会自动生成适合这个身份的微信邀请文案。
        </div>

        <select
          id="senderSelect"
          class="sender-select"
        >
          <option value="groom">
            新郎 · 邓天澍
          </option>

          <option value="bride">
            新娘 · 邹涛
          </option>

          <option value="groomFather">
            新郎爸爸
          </option>

          <option value="groomMother">
            新郎妈妈
          </option>

          <option value="brideFather">
            新娘爸爸
          </option>

          <option value="brideMother">
            新娘妈妈
          </option>
        </select>

      </div>


      <!-- =========================
           数据
      ========================= -->

      <div class="stats">

        <div class="stat">
          <div class="stat-label">
            宾客
          </div>

          <div
            id="totalCount"
            class="stat-number"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            已发送
          </div>

          <div
            id="sentCount"
            class="stat-number"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            已回复
          </div>

          <div
            id="repliedCount"
            class="stat-number"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            需要住宿
          </div>

          <div
            id="stayCount"
            class="stat-number"
          >
            0
          </div>
        </div>

      </div>


      <div class="section-label">

        <div class="section-label-title">
          宾客列表
        </div>

        <div class="section-label-en">
          GUESTS
        </div>

      </div>


      <!-- =========================
           宾客列表
      ========================= -->

      <div
        id="guestList"
        class="guest-list"
      >
        <div class="loading">
          正在加载……
        </div>
      </div>

    </div>

  </section>


  <script>

    const TOKEN_KEY =
      "wedding_admin_password";

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const guestNameInput =
      document.getElementById("guestNameInput");

    const addGuestButton =
      document.getElementById("addGuestButton");

    const message =
      document.getElementById("message");

    const guestList =
      document.getElementById("guestList");

    const totalCount =
      document.getElementById("totalCount");

    const sentCount =
      document.getElementById("sentCount");

    const repliedCount =
      document.getElementById("repliedCount");

    const stayCount =
      document.getElementById("stayCount");

    const logoutButton =
      document.getElementById("logoutButton");

    const senderSelect =
      document.getElementById("senderSelect");

    let currentGuests = [];
    let currentReplies = [];


    /* =========================
       页面显示
    ========================= */

    function showLogin() {
      loginPage.style.display = "flex";
      adminPage.style.display = "none";
      passwordInput.focus();
    }


    function showAdmin() {
      loginPage.style.display = "none";
      adminPage.style.display = "block";
    }


    /* =========================
       API
    ========================= */

    async function api(
      endpoint,
      options = {}
    ) {

      const password =
        sessionStorage.getItem(TOKEN_KEY);

      const headers = {
        ...(options.headers || {}),
        Authorization:
          `Bearer ${password || ""}`
      };

      if (options.body) {
        headers["Content-Type"] =
          "application/json";
      }

      let response;

      try {

        response = await fetch(
          endpoint,
          {
            ...options,
            headers
          }
        );

      } catch (error) {

        throw new Error(
          "网络连接失败：" +
          error.message
        );

      }

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          `服务器返回异常（HTTP ${response.status}）`
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          `请求失败（HTTP ${response.status}）`
        );
      }

      if (data.success === false) {
        throw new Error(
          data.error ||
          "服务器操作失败"
        );
      }

      return data;
    }


    /* =========================
       登录
    ========================= */

    async function login() {

      const password =
        passwordInput.value.trim();

      if (!password) {
        loginError.textContent =
          "请输入密码";
        return;
      }

      loginButton.disabled = true;

      loginButton.textContent =
        "验证中……";

      loginError.textContent = "";

      sessionStorage.setItem(
        TOKEN_KEY,
        password
      );

      try {

        await loadAll();

        showAdmin();

        passwordInput.value = "";

      } catch (error) {

        sessionStorage.removeItem(
          TOKEN_KEY
        );

        loginError.textContent =
          "错误：" +
          error.message;

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "进入管理页面";
      }
    }


    /* =========================
       加载全部数据
    ========================= */

    async function loadAll() {

      await Promise.all([
        loadGuests(),
        loadReplies()
      ]);

      renderGuests(
        currentGuests
      );
    }


    /* =========================
       获取宾客
    ========================= */

    async function loadGuests() {

      const data =
        await api(
          "/api/admin/guests",
          {
            method: "GET"
          }
        );

      currentGuests =
        data.guests || [];
    }


    /* =========================
       获取回复
    ========================= */

    async function loadReplies() {

      const data =
        await api(
          "/api/admin/replies",
          {
            method: "GET"
          }
        );

      currentReplies =
        data.replies || [];
    }


    /* =========================
       查找回复
    ========================= */

    function findReply(
      guestId
    ) {

      return currentReplies.find(
        reply =>
          Number(reply.guest_id) ===
          Number(guestId)
      );
    }


    /* =========================
       统计
    ========================= */

    function updateStats(
      guests
    ) {

      const sent =
        guests.filter(
          guest =>
            Number(guest.sent) === 1
        ).length;

      const replied =
        currentReplies.filter(
          reply =>
            reply.attendance === "yes" ||
            reply.attendance === "no"
        ).length;

      const staying =
        currentReplies.filter(
          reply =>
            reply.attendance === "yes" &&
            reply.stay === "yes"
        ).length;

      totalCount.textContent =
        guests.length;

      sentCount.textContent =
        sent;

      repliedCount.textContent =
        replied;

      stayCount.textContent =
        staying;
    }


    /* =========================
       回复显示
    ========================= */

    function renderReply(
      reply
    ) {

      if (!reply) {

        return `
          <div class="reply-box">

            <div class="reply-status waiting">
              尚未回复
            </div>

            <div class="reply-detail">
              等待宾客填写宾客回复。
            </div>

          </div>
        `;
      }


      if (reply.attendance === "no") {

        return `
          <div class="reply-box">

            <div class="reply-status replied">
              已回复 · 无法出席
            </div>

            <div class="reply-detail">
              <strong>出席：</strong>
              很遗憾无法出席
            </div>

            ${
              reply.message
                ? `
                  <div class="reply-message">
                    ${escapeHtml(reply.message)}
                  </div>
                `
                : ""
            }

          </div>
        `;
      }


      const stayText =
        reply.stay === "yes"
          ? "需要住宿"
          : "不需要住宿";

      const count =
        Number(reply.count) || 1;

      const dateText =
        reply.stay === "yes"
          ? `
            <br>
            <strong>入住：</strong>
            ${escapeHtml(reply.check_in || "未填写")}
            <br>
            <strong>退房：</strong>
            ${escapeHtml(reply.check_out || "未填写")}
          `
          : "";

      return `
        <div class="reply-box">

          <div class="reply-status replied">
            已回复 · 会出席
          </div>

          <div class="reply-detail">

            <strong>人数：</strong>
            ${count} 人

            <br>

            <strong>住宿：</strong>
            ${stayText}

            ${
              reply.stay === "yes"
                ? `
                  ${dateText}
                `
                : ""
            }

          </div>

          ${
            reply.message
              ? `
                <div class="reply-message">
                  ${escapeHtml(reply.message)}
                </div>
              `
              : ""
          }

        </div>
      `;
    }


    /* =========================
       渲染宾客
    ========================= */

    function renderGuests(
      guests
    ) {

      updateStats(guests);

      if (!guests.length) {

        guestList.innerHTML = `
          <div class="empty">
            还没有添加宾客
          </div>
        `;

        return;
      }


      guestList.innerHTML =
        guests.map(
          guest => {

            const isSent =
              Number(guest.sent) === 1;

            const reply =
              findReply(guest.id);

            return `
              <div class="guest-card">

                <div class="guest-top">

                  <div class="guest-name">
                    ${escapeHtml(
                      guest.name
                    )}
                  </div>

                  <div
                    class="status ${
                      isSent
                        ? "sent"
                        : "unsent"
                    }"
                  >
                    ${
                      isSent
                        ? "已发送"
                        : "未发送"
                    }
                  </div>

                </div>

                <div class="guest-link">
                  ${escapeHtml(
                    guest.link
                  )}
                </div>

                ${renderReply(reply)}

                <div class="actions">

                  <button
                    class="primary"
                    onclick="openInvite(${guest.id})"
                  >
                    生成微信邀请
                  </button>

                  <button
                    onclick="shareWechat(${guest.id})"
                  >
                    分享
                  </button>

                  <button
                    onclick="copyLink(${guest.id})"
                  >
                    复制链接
                  </button>

                  <button
                    onclick="toggleSent(
                      ${guest.id},
                      ${isSent}
                    )"
                  >
                    ${
                      isSent
                        ? "标记未发送"
                        : "标记已发送"
                    }
                  </button>

                  <button
                    class="delete"
                    onclick="deleteGuest(
                      ${guest.id}
                    )"
                  >
                    删除这位宾客
                  </button>

                </div>

              </div>
            `;

          }
        ).join("");

    }


    /* =========================
       安全处理
    ========================= */

    function escapeHtml(
      value
    ) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================
       添加宾客
    ========================= */

    async function addGuest() {

      const name =
        guestNameInput.value.trim();

      if (!name) {

        message.textContent =
          "请输入宾客姓名";

        return;
      }

      addGuestButton.disabled =
        true;

      addGuestButton.textContent =
        "添加中……";

      try {

        await api(
          "/api/admin/guests",
          {
            method: "POST",
            body: JSON.stringify({
              name
            })
          }
        );

        guestNameInput.value = "";

        message.textContent =
          `${name} 已添加，可以生成专属微信邀请`;

        await loadAll();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;

      } finally {

        addGuestButton.disabled =
          false;

        addGuestButton.textContent =
          "添加宾客";
      }
    }


    /* =========================
       查找宾客
    ========================= */

    function findGuest(id) {

      return currentGuests.find(
        guest =>
          Number(guest.id) ===
          Number(id)
      );
    }


    /* =========================
       生成微信邀请文案
    ========================= */

    function getWechatMessage(
      guest
    ) {

      const sender =
        senderSelect.value;

      let sentence = "";

      if (sender === "groom") {

        sentence =
          `${guest.name}，诚邀您参加我们的婚礼。`;

      } else if (sender === "bride") {

        sentence =
          `${guest.name}，诚邀您参加我们的婚礼。`;

      } else if (
        sender === "groomFather" ||
        sender === "groomMother"
      ) {

        sentence =
          `${guest.name}，诚邀您参加我儿子邓天澍和儿媳妇邹涛的婚礼。`;

      } else if (
        sender === "brideFather" ||
        sender === "brideMother"
      ) {

        sentence =
          `${guest.name}，诚邀您参加我女儿邹涛和女婿邓天澍的婚礼。`;

      }

      return `邓天澍 & 邹涛｜婚礼邀请

${sentence}

2026年10月25日，吉安见。

👉 点击打开专属请柬：
${guest.link}`;
    }


    /* =========================
       打开微信邀请
    ========================= */

    function openInvite(id) {

      const guest =
        findGuest(id);

      if (!guest) return;

      const existing =
        document.getElementById(
          `invite-${guest.id}`
        );

      if (existing) {
        existing.remove();
        return;
      }

      const card =
        document.querySelector(
          `.guest-card button[onclick="openInvite(${guest.id})"]`
        )?.closest(".guest-card");

      if (!card) return;

      const preview =
        document.createElement("div");

      preview.id =
        `invite-${guest.id}`;

      preview.className =
        "invite-preview";

      preview.innerHTML = `
        <div class="invite-preview-title">
          当前发送人：${escapeHtml(
            senderSelect.options[
              senderSelect.selectedIndex
            ].text
          )}
        </div>

        <textarea
          class="invite-preview-text"
          readonly
        >${escapeHtml(
          getWechatMessage(guest)
        )}</textarea>

        <div class="invite-preview-actions">

          <button
            class="main-copy"
            onclick="copyWechat(${guest.id})"
          >
            复制邀请
          </button>

          <button
            onclick="closeInvite(${guest.id})"
          >
            收起
          </button>

        </div>
      `;

      card.appendChild(preview);
    }


    function closeInvite(id) {

      const preview =
        document.getElementById(
          `invite-${id}`
        );

      if (preview) {
        preview.remove();
      }
    }


    /* =========================
       复制微信邀请
    ========================= */

    async function copyWechat(
      id
    ) {

      const guest =
        findGuest(id);

      if (!guest) return;

      const text =
        getWechatMessage(guest);

      try {

        await navigator.clipboard.writeText(
          text
        );

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "PATCH",
            body: JSON.stringify({
              sent: true
            })
          }
        );

        message.textContent =
          `${guest.name} 的邀请已复制，请到微信粘贴发送。`;

        await loadAll();

      } catch (error) {

        message.textContent =
          "复制失败：" +
          error.message;
      }
    }


    /* =========================
       系统分享
    ========================= */

    async function shareWechat(
      id
    ) {

      const guest =
        findGuest(id);

      if (!guest) return;

      const title =
        "邓天澍 & 邹涛｜婚礼邀请";

      const text =
        getWechatMessage(guest);

      try {

        if (navigator.share) {

          await navigator.share({
            title,
            text,
            url: guest.link
          });

          message.textContent =
            `${guest.name} 的邀请已打开分享。`;

        } else {

          await navigator.clipboard.writeText(
            text
          );

          message.textContent =
            "当前浏览器不支持系统分享，邀请内容已复制。";
        }

      } catch (error) {

        if (
          error.name ===
          "AbortError"
        ) {
          return;
        }

        message.textContent =
          "分享失败，可以使用「生成微信邀请」。";
      }
    }


    /* =========================
       复制链接
    ========================= */

    async function copyLink(
      id
    ) {

      const guest =
        findGuest(id);

      if (!guest) return;

      try {

        await navigator.clipboard.writeText(
          guest.link
        );

        message.textContent =
          `${guest.name} 的专属请柬链接已复制`;

      } catch {

        message.textContent =
          "复制失败，请手动复制链接";
      }
    }


    /* =========================
       修改发送状态
    ========================= */

    async function toggleSent(
      id,
      current
    ) {

      try {

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "PATCH",
            body: JSON.stringify({
              sent: !current
            })
          }
        );

        await loadAll();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;
      }
    }


    /* =========================
       删除
    ========================= */

    async function deleteGuest(
      id
    ) {

      const guest =
        findGuest(id);

      if (!guest) return;

      if (
        !confirm(
          `确定要删除「${guest.name}」吗？\n\n这个宾客的回复和住宿信息也会一起删除。`
        )
      ) {
        return;
      }

      try {

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "DELETE"
          }
        );

        message.textContent =
          `${guest.name} 已删除`;

        await loadAll();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;
      }
    }


    /* =========================
       发送人改变
    ========================= */

    senderSelect.addEventListener(
      "change",
      () => {

        /*
         * 如果当前已经打开了某个邀请预览，
         * 自动更新里面的文案。
         */
        const previews =
          document.querySelectorAll(
            ".invite-preview"
          );

        previews.forEach(
          preview => {

            const id =
              Number(
                preview.id.replace(
                  "invite-",
                  ""
                )
              );

            const guest =
              findGuest(id);

            if (!guest) return;

            const textarea =
              preview.querySelector(
                ".invite-preview-text"
              );

            const title =
              preview.querySelector(
                ".invite-preview-title"
              );

            if (textarea) {
              textarea.value =
                getWechatMessage(guest);
            }

            if (title) {
              title.textContent =
                `当前发送人：${
                  senderSelect.options[
                    senderSelect.selectedIndex
                  ].text
                }`;
            }
          }
        );
      }
    );


    /* =========================
       退出
    ========================= */

    function logout() {

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      showLogin();

      loginError.textContent = "";
    }


    /* =========================
       事件
    ========================= */

    loginButton.addEventListener(
      "click",
      login
    );

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {
          login();
        }

      }
    );

    addGuestButton.addEventListener(
      "click",
      addGuest
    );

    guestNameInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {
          addGuest();
        }

      }
    );

    logoutButton.addEventListener(
      "click",
      logout
    );


    /* =========================
       自动登录
    ========================= */

    const savedPassword =
      sessionStorage.getItem(
        TOKEN_KEY
      );

    if (savedPassword) {

      loadAll()
        .then(() => {

          showAdmin();

        })
        .catch(error => {

          sessionStorage.removeItem(
            TOKEN_KEY
          );

          showLogin();

          loginError.textContent =
            "错误：" +
            error.message;

        });

    } else {

      showLogin();

    }

  </script>

</body>
</html>
