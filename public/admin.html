<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>邓天澍 & 邹涛｜宾客管理</title>

  <style>
    @font-face {
      font-family: "WeddingChinese";
      src: url("/FZZiLSJW-B.TTF") format("truetype");
    }

    @font-face {
      font-family: "WeddingEnglish";
      src: url("/FZVDLGTMCJW-L.TTF") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ef;
      color: #403831;
      font-family: "WeddingChinese", serif;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       登录
    ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(120, 100, 80, 0.14);
      border-radius: 18px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(70, 50, 30, 0.08);
    }

    .login-en {
      font-family: "WeddingEnglish", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-bottom: 10px;
    }

    .login-title {
      font-size: 25px;
      font-weight: normal;
      margin: 0 0 28px;
    }

    .login-input {
      width: 100%;
      height: 48px;
      border: 1px solid #d7cec4;
      border-radius: 10px;
      background: #fff;
      padding: 0 14px;
      text-align: center;
      font-size: 15px;
      outline: none;
    }

    .login-input:focus {
      border-color: #9e9082;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #51483f;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
    }

    .login-error {
      margin-top: 14px;
      min-height: 40px;
      color: #a05252;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* =========================
       后台
    ========================= */

    .admin-page {
      display: none;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 26px 18px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 15px;
    }

    .header-en {
      font-family: "WeddingEnglish", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-bottom: 7px;
    }

    .header-title {
      font-size: 26px;
      font-weight: normal;
      margin: 0;
    }

    .logout {
      border: 1px solid #d4cbc1;
      background: transparent;
      color: #625950;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* =========================
       添加宾客
    ========================= */

    .add-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .add-title {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .guest-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #d7cec4;
      border-radius: 9px;
      background: white;
      padding: 0 13px;
      outline: none;
      font-size: 15px;
    }

    .add-button {
      height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #51483f;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .message {
      min-height: 20px;
      margin-top: 9px;
      font-size: 13px;
      color: #806f5e;
    }

    /* =========================
       数据
    ========================= */

    .stats {
      display: flex;
      gap: 9px;
      margin-bottom: 18px;
    }

    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(120, 100, 80, 0.1);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.6;
    }

    .stat-number {
      margin-top: 3px;
      font-family: "WeddingEnglish", serif;
      font-size: 24px;
    }

    /* =========================
       宾客卡片
    ========================= */

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 15px;
      padding: 17px;
    }

    .guest-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .guest-name {
      font-size: 20px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.sent {
      background: #e8eee7;
      color: #5c7159;
    }

    .status.unsent {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .guest-link {
      margin-top: 9px;
      font-family: "WeddingEnglish", serif;
      font-size: 11px;
      color: #81766d;
      word-break: break-all;
      line-height: 1.5;
      opacity: 0.8;
    }

    /* =========================
       操作按钮
    ========================= */

    .actions {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      min-height: 42px;
      border: 1px solid #d8d0c6;
      background: white;
      color: #5c544d;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 10px;
    }

    .actions .primary {
      background: #51483f;
      color: white;
      border-color: #51483f;
    }

    .actions .danger {
      color: #a05252;
    }

    .actions .delete {
      grid-column: 1 / -1;
      background: transparent;
      border-color: transparent;
      color: #a05252;
      min-height: 34px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #8c8177;
      font-size: 14px;
    }

    @media (max-width: 520px) {

      .page {
        padding: 22px 14px 40px;
      }

      .add-row {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .header-title {
        font-size: 23px;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .actions .primary {
        grid-column: 1 / -1;
      }

      .actions .delete {
        grid-column: 1 / -1;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       登录
  ========================= -->

  <section class="login-page" id="loginPage">

    <div class="login-card">

      <div class="login-en">
        WEDDING ADMIN
      </div>

      <h1 class="login-title">
        宾客管理
      </h1>

      <input
        id="passwordInput"
        class="login-input"
        type="password"
        placeholder="请输入管理员密码"
        autocomplete="current-password"
      />

      <button
        id="loginButton"
        class="login-button"
      >
        进入管理页面
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </section>


  <!-- =========================
       管理后台
  ========================= -->

  <section
    id="adminPage"
    class="admin-page"
  >

    <div class="page">

      <header class="header">

        <div>
          <div class="header-en">
            TIANSHU & TAO
          </div>

          <h1 class="header-title">
            宾客管理
          </h1>
        </div>

        <button
          id="logoutButton"
          class="logout"
        >
          退出
        </button>

      </header>


      <!-- 添加宾客 -->

      <div class="add-card">

        <div class="add-title">
          添加宾客
        </div>

        <div class="add-row">

          <input
            id="guestNameInput"
            class="guest-input"
            type="text"
            placeholder="输入宾客姓名，例如：邹小明"
          />

          <button
            id="addGuestButton"
            class="add-button"
          >
            添加宾客
          </button>

        </div>

        <div
          id="message"
          class="message"
        ></div>

      </div>


      <!-- 数据 -->

      <div class="stats">

        <div class="stat">
          <div class="stat-label">
            宾客
          </div>

          <div
            id="totalCount"
            class="stat-number"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            已发送
          </div>

          <div
            id="sentCount"
            class="stat-number"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            未发送
          </div>

          <div
            id="unsentCount"
            class="stat-number"
          >
            0
          </div>
        </div>

      </div>


      <!-- 宾客列表 -->

      <div
        id="guestList"
        class="guest-list"
      >
        <div class="loading">
          正在加载……
        </div>
      </div>

    </div>

  </section>


  <script>

    const TOKEN_KEY =
      "wedding_admin_password";

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const guestNameInput =
      document.getElementById("guestNameInput");

    const addGuestButton =
      document.getElementById("addGuestButton");

    const message =
      document.getElementById("message");

    const guestList =
      document.getElementById("guestList");

    const totalCount =
      document.getElementById("totalCount");

    const sentCount =
      document.getElementById("sentCount");

    const unsentCount =
      document.getElementById("unsentCount");

    const logoutButton =
      document.getElementById("logoutButton");

    let currentGuests = [];


    /* =========================
       页面显示
    ========================= */

    function showLogin() {

      loginPage.style.display = "flex";
      adminPage.style.display = "none";

      passwordInput.focus();

    }


    function showAdmin() {

      loginPage.style.display = "none";
      adminPage.style.display = "block";

    }


    /* =========================
       API
    ========================= */

    async function api(
      endpoint,
      options = {}
    ) {

      const password =
        sessionStorage.getItem(TOKEN_KEY);

      const headers = {
        ...(options.headers || {}),
        Authorization:
          `Bearer ${password || ""}`
      };

      if (options.body) {

        headers["Content-Type"] =
          "application/json";

      }

      let response;

      try {

        response = await fetch(
          endpoint,
          {
            ...options,
            headers
          }
        );

      } catch (error) {

        throw new Error(
          "网络连接失败：" +
          error.message
        );

      }

      let data;

      try {

        data = await response.json();

      } catch {

        throw new Error(
          `服务器返回异常（HTTP ${response.status}）`
        );

      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          `请求失败（HTTP ${response.status}）`
        );

      }

      if (data.success === false) {

        throw new Error(
          data.error ||
          "服务器操作失败"
        );

      }

      return data;

    }


    /* =========================
       登录
    ========================= */

    async function login() {

      const password =
        passwordInput.value.trim();

      if (!password) {

        loginError.textContent =
          "请输入密码";

        return;

      }

      loginButton.disabled = true;

      loginButton.textContent =
        "验证中……";

      loginError.textContent = "";

      sessionStorage.setItem(
        TOKEN_KEY,
        password
      );

      try {

        await loadGuests();

        showAdmin();

        passwordInput.value = "";

      } catch (error) {

        sessionStorage.removeItem(
          TOKEN_KEY
        );

        loginError.textContent =
          "错误：" +
          error.message;

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "进入管理页面";

      }

    }


    /* =========================
       获取宾客
    ========================= */

    async function loadGuests() {

      const data =
        await api(
          "/api/admin/guests",
          {
            method: "GET"
          }
        );

      currentGuests =
        data.guests || [];

      renderGuests(
        currentGuests
      );

    }


    /* =========================
       渲染宾客
    ========================= */

    function renderGuests(
      guests
    ) {

      const sent =
        guests.filter(
          guest =>
            Number(guest.sent) === 1
        ).length;

      const unsent =
        guests.length - sent;

      totalCount.textContent =
        guests.length;

      sentCount.textContent =
        sent;

      unsentCount.textContent =
        unsent;

      if (!guests.length) {

        guestList.innerHTML = `
          <div class="empty">
            还没有添加宾客
          </div>
        `;

        return;

      }

      guestList.innerHTML =
        guests.map(
          guest => {

            const isSent =
              Number(guest.sent) === 1;

            return `
              <div class="guest-card">

                <div class="guest-top">

                  <div class="guest-name">
                    ${escapeHtml(
                      guest.name
                    )}
                  </div>

                  <div
                    class="status ${
                      isSent
                        ? "sent"
                        : "unsent"
                    }"
                  >
                    ${
                      isSent
                        ? "已发送"
                        : "未发送"
                    }
                  </div>

                </div>

                <div class="guest-link">
                  ${escapeHtml(
                    guest.link
                  )}
                </div>

                <div class="actions">

                  <button
                    class="primary"
                    onclick="copyWechat(${guest.id})"
                  >
                    复制微信邀请
                  </button>

                  <button
                    onclick="shareWechat(${guest.id})"
                  >
                    分享
                  </button>

                  <button
                    onclick="copyLink(${guest.id})"
                  >
                    复制链接
                  </button>

                  <button
                    onclick="toggleSent(
                      ${guest.id},
                      ${isSent}
                    )"
                  >
                    ${
                      isSent
                        ? "标记未发送"
                        : "标记已发送"
                    }
                  </button>

                  <button
                    class="delete"
                    onclick="deleteGuest(
                      ${guest.id}
                    )"
                  >
                    删除这位宾客
                  </button>

                </div>

              </div>
            `;

          }
        ).join("");

    }


    /* =========================
       安全处理
    ========================= */

    function escapeHtml(
      value
    ) {

      return String(value)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       添加宾客
    ========================= */

    async function addGuest() {

      const name =
        guestNameInput.value.trim();

      if (!name) {

        message.textContent =
          "请输入宾客姓名";

        return;

      }

      addGuestButton.disabled =
        true;

      addGuestButton.textContent =
        "添加中……";

      try {

        await api(
          "/api/admin/guests",
          {
            method: "POST",
            body: JSON.stringify({
              name
            })
          }
        );

        guestNameInput.value = "";

        message.textContent =
          `${name} 已添加，可以直接发送微信邀请`;

        await loadGuests();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;

      } finally {

        addGuestButton.disabled =
          false;

        addGuestButton.textContent =
          "添加宾客";

      }

    }


    /* =========================
       查找宾客
    ========================= */

    function findGuest(id) {

      return currentGuests.find(
        guest =>
          Number(guest.id) ===
          Number(id)
      );

    }


    /* =========================
       生成微信邀请
    ========================= */

    function getWechatMessage(
      guest
    ) {

      return `邓天澍 & 邹涛｜婚礼邀请

${guest.name}，诚邀您参加我们的婚礼。

2026年10月25日，吉安见。

👉 点击打开专属请柬：
${guest.link}`;

    }


    /* =========================
       复制微信邀请
    ========================= */

    async function copyWechat(id) {

      const guest =
        findGuest(id);

      if (!guest) return;

      const text =
        getWechatMessage(guest);

      try {

        await navigator.clipboard.writeText(
          text
        );

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "PATCH",
            body: JSON.stringify({
              sent: true
            })
          }
        );

        message.textContent =
          `${guest.name} 的微信邀请已复制，可以直接去微信粘贴`;

        await loadGuests();

      } catch (error) {

        message.textContent =
          "复制失败：" +
          error.message;

      }

    }


    /* =========================
       系统分享
    ========================= */

    async function shareWechat(id) {

      const guest =
        findGuest(id);

      if (!guest) return;

      const title =
        "邓天澍 & 邹涛｜婚礼邀请";

      const text =
        `${guest.name}，诚邀您参加我们的婚礼。

2026年10月25日，吉安见。`;

      try {

        if (
          navigator.share
        ) {

          await navigator.share({
            title,
            text,
            url: guest.link
          });

          message.textContent =
            `${guest.name} 的邀请已打开分享`;

        } else {

          await navigator.clipboard.writeText(
            getWechatMessage(guest)
          );

          message.textContent =
            "当前浏览器不支持直接分享，邀请内容已复制";

        }

      } catch (error) {

        if (
          error.name ===
          "AbortError"
        ) {
          return;
        }

        message.textContent =
          "分享失败，可以使用「复制微信邀请」";

      }

    }


    /* =========================
       复制链接
    ========================= */

    async function copyLink(id) {

      const guest =
        findGuest(id);

      if (!guest) return;

      try {

        await navigator.clipboard.writeText(
          guest.link
        );

        message.textContent =
          `${guest.name} 的专属请柬链接已复制`;

      } catch {

        message.textContent =
          "复制失败，请手动复制链接";

      }

    }


    /* =========================
       修改发送状态
    ========================= */

    async function toggleSent(
      id,
      current
    ) {

      try {

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "PATCH",
            body: JSON.stringify({
              sent: !current
            })
          }
        );

        await loadGuests();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;

      }

    }


    /* =========================
       删除
    ========================= */

    async function deleteGuest(
      id
    ) {

      const guest =
        findGuest(id);

      if (!guest) return;

      if (
        !confirm(
          `确定要删除「${guest.name}」吗？`
        )
      ) {
        return;
      }

      try {

        await api(
          `/api/admin/guests/${id}`,
          {
            method: "DELETE"
          }
        );

        message.textContent =
          `${guest.name} 已删除`;

        await loadGuests();

      } catch (error) {

        message.textContent =
          "错误：" +
          error.message;

      }

    }


    /* =========================
       退出
    ========================= */

    function logout() {

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      showLogin();

      loginError.textContent = "";

    }


    /* =========================
       事件
    ========================= */

    loginButton.addEventListener(
      "click",
      login
    );

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );

    addGuestButton.addEventListener(
      "click",
      addGuest
    );

    guestNameInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          addGuest();

        }

      }
    );

    logoutButton.addEventListener(
      "click",
      logout
    );


    /* =========================
       自动登录
    ========================= */

    const savedPassword =
      sessionStorage.getItem(
        TOKEN_KEY
      );

    if (savedPassword) {

      loadGuests()
        .then(() => {

          showAdmin();

        })
        .catch(error => {

          sessionStorage.removeItem(
            TOKEN_KEY
          );

          showLogin();

          loginError.textContent =
            "错误：" +
            error.message;

        });

    } else {

      showLogin();

    }

  </script>

</body>
</html>
