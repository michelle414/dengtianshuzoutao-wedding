<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>婚礼宾客管理</title>

  <style>
    @font-face {
      font-family: "WeddingChinese";
      src: url("/FZZiLSJW-B.TTF") format("truetype");
    }

    @font-face {
      font-family: "WeddingEnglish";
      src: url("/FZVDLGTMCJW-L.TTF") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ef;
      color: #3f3832;
      font-family: "WeddingChinese", serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    /* =========================
       登录
    ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(120, 100, 80, 0.15);
      padding: 38px 28px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(70, 50, 30, 0.08);
      text-align: center;
    }

    .login-card .en {
      font-family: "WeddingEnglish", serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .login-card h1 {
      font-size: 25px;
      font-weight: normal;
      margin: 0 0 28px;
    }

    .login-card input {
      width: 100%;
      height: 48px;
      border: 1px solid #d8d0c6;
      border-radius: 10px;
      background: #fff;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
      text-align: center;
    }

    .login-card input:focus {
      border-color: #a89988;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #51483f;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .login-error {
      color: #a05252;
      font-size: 13px;
      min-height: 20px;
      margin-top: 12px;
    }

    /* =========================
       管理页面
    ========================= */

    .admin-page {
      display: none;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header-en {
      font-family: "WeddingEnglish", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-bottom: 7px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: normal;
    }

    .logout {
      border: 1px solid #d5cdc3;
      background: transparent;
      color: #665d55;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .add-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #d8d0c6;
      border-radius: 9px;
      background: #fff;
      padding: 0 13px;
      outline: none;
      font-size: 15px;
    }

    .add-row button {
      flex: 0 0 auto;
      height: 46px;
      border: 0;
      border-radius: 9px;
      padding: 0 18px;
      background: #51483f;
      color: white;
      cursor: pointer;
    }

    .message {
      min-height: 20px;
      font-size: 13px;
      margin-top: 10px;
      color: #806f5e;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(120, 100, 80, 0.1);
      border-radius: 12px;
      padding: 13px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.6;
    }

    .stat-number {
      font-family: "WeddingEnglish", serif;
      font-size: 25px;
      margin-top: 3px;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(120, 100, 80, 0.12);
      border-radius: 15px;
      padding: 16px;
    }

    .guest-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .guest-name {
      font-size: 19px;
    }

    .status {
      font-size: 12px;
      border-radius: 20px;
      padding: 5px 9px;
      white-space: nowrap;
    }

    .status.unsent {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .status.sent {
      background: #e8eee7;
      color: #5c7159;
    }

    .guest-link {
      margin-top: 9px;
      font-family: "WeddingEnglish", serif;
      font-size: 11px;
      color: #81766d;
      word-break: break-all;
      line-height: 1.5;
    }

    .guest-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .guest-actions button {
      border: 1px solid #d8d0c6;
      background: #fff;
      color: #5c544d;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
    }

    .guest-actions .primary {
      background: #51483f;
      color: #fff;
      border-color: #51483f;
    }

    .guest-actions .danger {
      color: #a05252;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #8c8177;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #8c8177;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .page {
        padding: 22px 14px 40px;
      }

      .header {
        align-items: center;
      }

      .header h1 {
        font-size: 23px;
      }

      .add-row {
        flex-direction: column;
      }

      .add-row button {
        width: 100%;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        padding: 11px;
      }

      .guest-card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       登录页面
  ========================= -->

  <section class="login-page" id="loginPage">
    <div class="login-card">

      <div class="en">WEDDING ADMIN</div>

      <h1>宾客管理</h1>

      <input
        id="passwordInput"
        type="password"
        placeholder="请输入管理员密码"
        autocomplete="current-password"
      />

      <button class="login-button" id="loginButton">
        进入管理页面
      </button>

      <div class="login-error" id="loginError"></div>

    </div>
  </section>


  <!-- =========================
       管理页面
  ========================= -->

  <section class="admin-page" id="adminPage">

    <div class="page">

      <header class="header">
        <div>
          <div class="header-en">TIANSHU & TAO</div>
          <h1>宾客管理</h1>
        </div>

        <button class="logout" id="logoutButton">
          退出
        </button>
      </header>


      <!-- 添加宾客 -->

      <div class="add-card">

        <div class="add-row">

          <input
            id="guestNameInput"
            type="text"
            placeholder="输入宾客姓名"
          />

          <button id="addGuestButton">
            添加宾客
          </button>

        </div>

        <div class="message" id="message"></div>

      </div>


      <!-- 数据统计 -->

      <div class="stats">

        <div class="stat">
          <div class="stat-label">宾客</div>
          <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">已发送</div>
          <div class="stat-number" id="sentCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">未发送</div>
          <div class="stat-number" id="unsentCount">0</div>
        </div>

      </div>


      <!-- 宾客列表 -->

      <div class="guest-list" id="guestList">
        <div class="loading">
          正在加载……
        </div>
      </div>

    </div>

  </section>


  <script>
    const TOKEN_KEY = "wedding_admin_token";

    const loginPage = document.getElementById("loginPage");
    const adminPage = document.getElementById("adminPage");

    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");

    const guestNameInput = document.getElementById("guestNameInput");
    const addGuestButton = document.getElementById("addGuestButton");

    const guestList = document.getElementById("guestList");
    const message = document.getElementById("message");

    const totalCount = document.getElementById("totalCount");
    const sentCount = document.getElementById("sentCount");
    const unsentCount = document.getElementById("unsentCount");

    const logoutButton = document.getElementById("logoutButton");


    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY);
    }


    function showLogin() {
      loginPage.style.display = "flex";
      adminPage.style.display = "none";
      passwordInput.focus();
    }


    function showAdmin() {
      loginPage.style.display = "none";
      adminPage.style.display = "block";
    }


    async function api(url, options = {}) {
      const token = getToken();

      const headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`
      };

      if (options.body && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      const data = await response.json().catch(() => ({
        success: false,
        error: "服务器返回异常"
      }));

      if (response.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        showLogin();
        throw new Error(data.error || "密码错误");
      }

      if (!response.ok || data.success === false) {
        throw new Error(data.error || "操作失败");
      }

      return data;
    }


    async function login() {
      const password = passwordInput.value.trim();

      if (!password) {
        loginError.textContent = "请输入密码";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "验证中……";
      loginError.textContent = "";

      sessionStorage.setItem(TOKEN_KEY, password);

      try {
        await loadGuests();

        showAdmin();

        passwordInput.value = "";

      } catch (error) {
        sessionStorage.removeItem(TOKEN_KEY);

        loginError.textContent =
          error.message === "密码错误"
            ? "密码不正确，请重新输入"
            : "无法连接管理系统，请稍后再试";

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "进入管理页面";
      }
    }


    async function loadGuests() {
      const data = await api("/api/admin/guests");

      renderGuests(data.guests || []);
    }


    function renderGuests(guests) {

      const sent = guests.filter(item => Number(item.sent) === 1).length;
      const unsent = guests.length - sent;

      totalCount.textContent = guests.length;
      sentCount.textContent = sent;
      unsentCount.textContent = unsent;


      if (!guests.length) {
        guestList.innerHTML = `
          <div class="empty">
            还没有添加宾客
          </div>
        `;
        return;
      }


      guestList.innerHTML = guests.map(guest => {

        const isSent = Number(guest.sent) === 1;

        return `
          <div class="guest-card">

            <div class="guest-top">

              <div class="guest-name">
                ${escapeHtml(guest.name)}
              </div>

              <div class="status ${isSent ? "sent" : "unsent"}">
                ${isSent ? "已发送" : "未发送"}
              </div>

            </div>

            <div class="guest-link">
              ${escapeHtml(guest.link)}
            </div>

            <div class="guest-actions">

              <button
                class="primary"
                onclick="copyLink(${guest.id})"
              >
                复制请柬链接
              </button>

              <button
                onclick="copyWechat(${guest.id})"
              >
                复制微信话术
              </button>

              <button
                onclick="toggleSent(${guest.id}, ${isSent})"
              >
                ${isSent ? "标记未发送" : "标记已发送"}
              </button>

              <button
                class="danger"
                onclick="deleteGuest(${guest.id})"
              >
                删除
              </button>

            </div>

          </div>
        `;

      }).join("");

      window.currentGuests = guests;
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    async function addGuest() {

      const name = guestNameInput.value.trim();

      if (!name) {
        message.textContent = "请输入宾客姓名";
        return;
      }

      addGuestButton.disabled = true;
      addGuestButton.textContent = "添加中……";
      message.textContent = "";

      try {

        await api("/api/admin/guests", {
          method: "POST",
          body: JSON.stringify({
            name
          })
        });

        guestNameInput.value = "";

        message.textContent = "添加成功";

        await loadGuests();

      } catch (error) {

        message.textContent = error.message;

      } finally {

        addGuestButton.disabled = false;
        addGuestButton.textContent = "添加宾客";

      }
    }


    function findGuest(id) {
      return (window.currentGuests || [])
        .find(item => Number(item.id) === Number(id));
    }


    async function copyLink(id) {

      const guest = findGuest(id);

      if (!guest) return;

      try {

        await navigator.clipboard.writeText(guest.link);

        message.textContent =
          `${guest.name} 的请柬链接已复制`;

      } catch {

        message.textContent =
          "复制失败，请长按链接手动复制";

      }
    }


    async function copyWechat(id) {

      const guest = findGuest(id);

      if (!guest) return;

      const text =
`诚邀您出席邓天澍 & 邹涛的结婚典礼。

时间：2026年10月25日 周日
地点：吉安宾馆·礼堂

这是专属于您的电子请柬：
${guest.link}`;

      try {

        await navigator.clipboard.writeText(text);

        await api(`/api/admin/guests/${id}`, {
          method: "PATCH",
          body: JSON.stringify({
            sent: true
          })
        });

        message.textContent =
          `${guest.name} 的微信话术已复制，并已标记为已发送`;

        await loadGuests();

      } catch (error) {

        message.textContent = error.message;

      }
    }


    async function toggleSent(id, current) {

      try {

        await api(`/api/admin/guests/${id}`, {
          method: "PATCH",
          body: JSON.stringify({
            sent: !current
          })
        });

        await loadGuests();

      } catch (error) {

        message.textContent = error.message;

      }
    }


    async function deleteGuest(id) {

      const guest = findGuest(id);

      if (!guest) return;

      const confirmed =
        confirm(`确定要删除「${guest.name}」吗？`);

      if (!confirmed) return;

      try {

        await api(`/api/admin/guests/${id}`, {
          method: "DELETE"
        });

        message.textContent =
          `${guest.name} 已删除`;

        await loadGuests();

      } catch (error) {

        message.textContent = error.message;

      }
    }


    function logout() {

      sessionStorage.removeItem(TOKEN_KEY);

      showLogin();

      loginError.textContent = "";

    }


    loginButton.addEventListener("click", login);

    passwordInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        login();
      }
    });

    addGuestButton.addEventListener("click", addGuest);

    guestNameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addGuest();
      }
    });

    logoutButton.addEventListener("click", logout);


    // =========================
    // 自动检查之前是否已经登录
    // =========================

    if (getToken()) {

      loadGuests()
        .then(() => {
          showAdmin();
        })
        .catch(() => {
          sessionStorage.removeItem(TOKEN_KEY);
          showLogin();
        });

    } else {

      showLogin();

    }
  </script>

</body>
</html>
