<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#f7f3ee"
  />

  <title>婚礼请柬管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f7f3ee;
      color: #2e2a27;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    body {
      padding-bottom: 60px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        18px
        50px;
    }

    .hidden {
      display: none !important;
    }

    .login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow:
        0 20px 60px rgba(60, 45, 35, 0.08);
    }

    .login-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #8a817a;
      font-size: 14px;
      margin-bottom: 26px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ddd3ca;
      background: #fffdfb;
      border-radius: 14px;
      outline: none;
      color: #332e2a;
    }

    input,
    select {
      height: 48px;
      padding: 0 14px;
    }

    textarea {
      padding: 14px;
      min-height: 160px;
      resize: vertical;
      line-height: 1.7;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b99f8c;
      box-shadow:
        0 0 0 3px rgba(185, 159, 140, 0.12);
    }

    .btn {
      border: 0;
      border-radius: 14px;
      min-height: 44px;
      padding: 10px 15px;
      cursor: pointer;
      background: #3c3530;
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-light {
      background: #eee7e0;
      color: #4a423c;
    }

    .btn-outline {
      background: transparent;
      color: #4a423c;
      border: 1px solid #d5c9bf;
    }

    .btn-danger {
      background: #8b5f58;
      color: #fff;
    }

    .btn-full {
      width: 100%;
    }

    .header {
      padding: 20px 0 24px;
    }

    .eyebrow {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #9b8979;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 34px;
      margin: 8px 0 5px;
    }

    .subtitle {
      color: #91877f;
      font-size: 14px;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .sender-box,
    .add-box,
    .preview-box,
    .public-box {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(214, 202, 192, 0.8);
      border-radius: 20px;
      padding: 16px;
      box-shadow:
        0 10px 35px rgba(60, 45, 35, 0.04);
    }

    .sender-label {
      display: block;
      font-size: 13px;
      color: #81766e;
      margin-bottom: 8px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid #ded3ca;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.72);
      padding: 13px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .stat.active {
      background: #3c3530;
      color: #fff;
      border-color: #3c3530;
    }

    .stat-number {
      display: block;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 11px;
      opacity: 0.75;
    }

    .guest-list {
      display: grid;
      gap: 12px;
    }

    .guest-card {
      background: #fffdfb;
      border: 1px solid #e0d6ce;
      border-radius: 20px;
      padding: 16px;
    }

    .guest-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .guest-name {
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
    }

    .guest-status {
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eee8e1;
      color: #736860;
      white-space: nowrap;
    }

    .guest-status.sent {
      background: #e7efe6;
      color: #52684f;
    }

    .guest-meta {
      margin-top: 9px;
      color: #8b8179;
      font-size: 12px;
      line-height: 1.7;
    }

    .reply-info {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 13px;
      background: #f6f1ec;
      font-size: 13px;
      line-height: 1.7;
    }

    .guest-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 13px;
    }

    .guest-actions .wide {
      grid-column: span 2;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #958a82;
      font-size: 14px;
    }

    .preview-box {
      margin-top: 16px;
    }

    .preview-label {
      font-size: 13px;
      color: #847970;
      margin-bottom: 8px;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .preview-actions .btn {
      flex: 1;
    }

    .public-item {
      border-top: 1px solid #e8dfd8;
      padding: 13px 0;
    }

    .public-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .public-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .public-message {
      font-size: 13px;
      color: #736961;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .public-time {
      font-size: 11px;
      color: #a39891;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        max(24px, calc(env(safe-area-inset-bottom) + 18px));
      transform: translateX(-50%) translateY(20px);
      background: rgba(45, 39, 35, 0.94);
      color: #fff;
      border-radius: 999px;
      padding: 11px 17px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 9999;
      max-width: calc(100vw - 40px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 30px;
      }

      .stats {
        gap: 6px;
      }

      .stat {
        padding: 12px 5px;
      }

      .stat-number {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
      }

      .guest-actions {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- 登录 -->
  <div id="loginPage" class="login">
    <div class="login-card">

      <div class="login-title">
        Wedding
      </div>

      <div class="login-subtitle">
        邓天澍 & 邹涛 · 婚礼请柬管理
      </div>

      <input
        id="passwordInput"
        type="password"
        placeholder="请输入管理员密码"
        autocomplete="current-password"
      />

      <div style="height:10px"></div>

      <button
        class="btn btn-full"
        onclick="login()"
      >
        进入管理
      </button>

    </div>
  </div>


  <!-- 管理后台 -->
  <main
    id="adminPage"
    class="page hidden"
  >

    <header class="header">

      <div class="eyebrow">
        Wedding Invitation
      </div>

      <h1>
        婚礼请柬
      </h1>

      <div class="subtitle">
        邓天澍 & 邹涛 · 2026.10.25 · 吉安
      </div>

    </header>


    <!-- 发送人 -->
    <section class="section">

      <div class="section-title">
        谁来发邀请？
      </div>

      <div class="sender-box">

        <label
          class="sender-label"
          for="senderSelect"
        >
          邀请人身份
        </label>

        <select id="senderSelect">

          <option value="groom">
            新郎
          </option>

          <option value="bride">
            新娘
          </option>

          <option value="groomFather">
            新郎爸爸
          </option>

          <option value="groomMother">
            新郎妈妈
          </option>

          <option value="brideFather">
            新娘爸爸
          </option>

          <option value="brideMother">
            新娘妈妈
          </option>

        </select>

      </div>

    </section>


    <!-- 统计 -->
    <section class="section">

      <div class="stats">

        <div
          id="statAll"
          class="stat active"
          onclick="setFilter('all')"
        >
          <span
            id="countAll"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            全部
          </span>
        </div>

        <div
          id="statSent"
          class="stat"
          onclick="setFilter('sent')"
        >
          <span
            id="countSent"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            已发送
          </span>
        </div>

        <div
          id="statReplied"
          class="stat"
          onclick="setFilter('replied')"
        >
          <span
            id="countReplied"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            已回复
          </span>
        </div>

        <div
          id="statStay"
          class="stat"
          onclick="setFilter('stay')"
        >
          <span
            id="countStay"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            需住宿
          </span>
        </div>

      </div>

    </section>


    <!-- 添加宾客 -->
    <section class="section">

      <div class="section-title">
        添加宾客
      </div>

      <div class="add-box">

        <div class="add-row">

          <input
            id="guestNameInput"
            type="text"
            placeholder="输入宾客姓名"
            autocomplete="off"
          />

          <button
            class="btn"
            onclick="addGuest()"
          >
            添加
          </button>

        </div>

      </div>

    </section>


    <!-- 宾客列表 -->
    <section class="section">

      <div class="section-title">
        宾客名单
      </div>

      <div
        id="guestList"
        class="guest-list"
      ></div>

    </section>


    <!-- 邀请预览 -->
    <section
      id="previewSection"
      class="section hidden"
    >

      <div class="section-title">
        微信邀请预览
      </div>

      <div class="preview-box">

        <div
          id="previewLabel"
          class="preview-label"
        ></div>

        <textarea
          id="previewText"
          readonly
        ></textarea>

        <div class="preview-actions">

          <button
            class="btn btn-light"
            onclick="copyPreview()"
          >
            复制邀请
          </button>

          <button
            class="btn"
            onclick="sharePreview()"
          >
            分享
          </button>

        </div>

      </div>

    </section>


    <!-- 陌生访客留言 -->
    <section class="section">

      <div class="section-title">
        访客留言
      </div>

      <div
        id="publicReplies"
        class="public-box"
      ></div>

    </section>

  </main>


  <div
    id="toast"
    class="toast"
  ></div>


<script>

  /*
   * ==========================
   * 全局状态
   * ==========================
   */

  let token = "";

  let guests = [];

  let currentReplies = [];

  let currentFilter = "all";

  let currentPreviewGuest = null;


  /*
   * ==========================
   * 登录
   * ==========================
   */

  async function login() {

    const password =
      document
        .getElementById("passwordInput")
        .value
        .trim();

    if (!password) {
      showToast("请输入管理员密码");
      return;
    }

    token = password;

    try {

      await loadAll();

      document
        .getElementById("loginPage")
        .classList
        .add("hidden");

      document
        .getElementById("adminPage")
        .classList
        .remove("hidden");

    } catch (error) {

      token = "";

      showToast(
        error.message || "登录失败"
      );

    }
  }


  document
    .getElementById("passwordInput")
    .addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


  /*
   * ==========================
   * API
   * ==========================
   */

  async function api(
    path,
    options = {}
  ) {

    const headers = {
      ...(options.headers || {}),
      "Authorization":
        `Bearer ${token}`,
    };

    if (
      options.body &&
      typeof options.body !== "string"
    ) {
      headers["Content-Type"] =
        "application/json";

      options.body =
        JSON.stringify(options.body);
    }

    const response =
      await fetch(
        path,
        {
          ...options,
          headers,
          cache: "no-store",
        }
      );

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        `请求失败 ${response.status}`
      );

    }

    return data;
  }


  /*
   * ==========================
   * 加载全部
   * ==========================
   */

  async function loadAll() {

    const [
      guestData,
      replyData,
    ] = await Promise.all([

      api("/api/admin/guests"),

      api("/api/admin/replies"),

    ]);

    guests =
      guestData.guests || [];

    currentReplies =
      replyData.replies || [];

    updateStats();

    renderGuests();

    renderPublicReplies();
  }


  /*
   * ==========================
   * 添加宾客
   * ==========================
   */

  async function addGuest() {

    const input =
      document
        .getElementById(
          "guestNameInput"
        );

    const name =
      input.value.trim();

    if (!name) {

      showToast(
        "请输入宾客姓名"
      );

      input.focus();

      return;
    }

    try {

      await api(
        "/api/admin/guests",
        {
          method: "POST",
          body: {
            name,
          },
        }
      );

      input.value = "";

      await loadAll();

      showToast(
        "宾客已添加"
      );

    } catch (error) {

      showToast(
        error.message
      );

    }
  }


  /*
   * ==========================
   * 统计
   * ==========================
   */

  function updateStats() {

    const all =
      guests.length;

    const sent =
      guests.filter(
        guest => Number(guest.sent) === 1
      ).length;

    const replied =
      guests.filter(
        guest =>
          findReply(guest.id)
      ).length;

    const stay =
      guests.filter(
        guest => {

          const reply =
            findReply(guest.id);

          return (
            reply &&
            reply.stay === "yes"
          );

        }
      ).length;

    document
      .getElementById("countAll")
      .textContent = all;

    document
      .getElementById("countSent")
      .textContent = sent;

    document
      .getElementById("countReplied")
      .textContent = replied;

    document
      .getElementById("countStay")
      .textContent = stay;
  }


  /*
   * ==========================
   * 筛选
   * ==========================
   */

  function setFilter(filter) {

    currentFilter = filter;

    document
      .querySelectorAll(".stat")
      .forEach(
        element =>
          element.classList.remove(
            "active"
          )
      );

    const map = {
      all: "statAll",
      sent: "statSent",
      replied: "statReplied",
      stay: "statStay",
    };

    document
      .getElementById(map[filter])
      .classList
      .add("active");

    renderGuests();
  }


  function getFilteredGuests() {

    if (currentFilter === "all") {
      return guests;
    }

    return guests.filter(
      guest => {

        const reply =
          findReply(guest.id);

        if (
          currentFilter === "sent"
        ) {
          return (
            Number(guest.sent) === 1
          );
        }

        if (
          currentFilter === "replied"
        ) {
          return Boolean(reply);
        }

        if (
          currentFilter === "stay"
        ) {
          return (
            reply &&
            reply.stay === "yes"
          );
        }

        return true;
      }
    );
  }


  /*
   * ==========================
   * 找回复
   * ==========================
   */

  function findReply(guestId) {

    return (
      currentReplies.find(
        reply =>
          Number(reply.guest_id) ===
          Number(guestId)
      ) || null
    );

  }


  /*
   * ==========================
   * 渲染宾客
   * ==========================
   */

  function renderGuests() {

    const list =
      document.getElementById(
        "guestList"
      );

    const filtered =
      getFilteredGuests();

    if (!filtered.length) {

      list.innerHTML = `
        <div class="empty">
          当前没有符合条件的宾客
        </div>
      `;

      return;
    }

    list.innerHTML =
      filtered
        .map(renderGuestCard)
        .join("");
  }


  function renderGuestCard(guest) {

    const reply =
      findReply(guest.id);

    const sent =
      Number(guest.sent) === 1;

    let replyHtml = "";

    if (reply) {

      const attendance =
        reply.attendance === "yes"
          ? "参加"
          : "不参加";

      const stay =
        reply.stay === "yes"
          ? "需要住宿"
          : "不需要住宿";

      replyHtml = `
        <div class="reply-info">
          <strong>回复：</strong>
          ${attendance}
          · ${reply.count || 1} 人
          · ${stay}

          ${
            reply.message
              ? `<br><strong>留言：</strong>${escapeHtml(reply.message)}`
              : ""
          }
        </div>
      `;

    }

    return `
      <div class="guest-card">

        <div class="guest-top">

          <div class="guest-name">
            ${escapeHtml(guest.name)}
          </div>

          <div
            class="guest-status ${
              sent ? "sent" : ""
            }"
          >
            ${
              sent
                ? "已发送"
                : "未发送"
            }
          </div>

        </div>

        <div class="guest-meta">
          专属链接已生成
        </div>

        ${replyHtml}

        <div class="guest-actions">

          <button
            class="btn wide"
            onclick="previewInvite(${guest.id})"
          >
            生成微信邀请
          </button>

          <button
            class="btn"
            onclick="shareWechat(${guest.id})"
          >
            分享
          </button>

          <button
            class="btn btn-light"
            onclick="copyGuestLink(${guest.id})"
          >
            复制链接
          </button>

          <button
            class="btn ${
              sent
                ? "btn-light"
                : ""
            }"
            onclick="toggleSent(${guest.id})"
          >
            ${
              sent
                ? "标记未发送"
                : "标记已发送"
            }
          </button>

          <button
            class="btn btn-outline"
            onclick="deleteGuest(${guest.id})"
          >
            删除
          </button>

        </div>

      </div>
    `;
  }


  /*
   * ==========================
   * 邀请文案
   * ==========================
   */

  function buildInviteMessage(
    guest
  ) {

    const sender =
      document
        .getElementById(
          "senderSelect"
        )
        .value;

    let firstLine = "";

    if (sender === "groom") {

      firstLine =
        `${guest.name}，诚邀您参加我们的婚礼。`;

    } else if (
      sender === "bride"
    ) {

      firstLine =
        `${guest.name}，诚邀您参加我们的婚礼。`;

    } else if (
      sender === "groomFather" ||
      sender === "groomMother"
    ) {

      firstLine =
        `${guest.name}，诚邀您参加我儿子邓天澍和儿媳妇邹涛的婚礼。`;

    } else if (
      sender === "brideFather" ||
      sender === "brideMother"
    ) {

      firstLine =
        `${guest.name}，诚邀您参加我女儿邹涛和女婿邓天澍的婚礼。`;

    }

    return `${firstLine}

2026年10月25日，吉安见。

👉 点击打开专属请柬：
${guest.link}`;
  }


  /*
   * ==========================
   * 生成预览
   * ==========================
   */

  function previewInvite(
    guestId
  ) {

    const guest =
      guests.find(
        item =>
          Number(item.id) ===
          Number(guestId)
      );

    if (!guest) return;

    currentPreviewGuest =
      guest;

    const message =
      buildInviteMessage(
        guest
      );

    document
      .getElementById(
        "previewLabel"
      )
      .textContent =
      `${guest.name} · 当前发送人：${
        document
          .getElementById(
            "senderSelect"
          )
          .selectedOptions[0]
          .textContent
      }`;

    document
      .getElementById(
        "previewText"
      )
      .value = message;

    document
      .getElementById(
        "previewSection"
      )
      .classList
      .remove("hidden");

    document
      .getElementById(
        "previewSection"
      )
      .scrollIntoView({
        behavior: "smooth",
        block: "center",
      });
  }


  /*
   * ==========================
   * 复制邀请
   *
   * 注意：
   * 不自动标记已发送
   * ==========================
   */

  async function copyPreview() {

    if (!currentPreviewGuest) {

      showToast(
        "请先生成邀请"
      );

      return;
    }

    const message =
      buildInviteMessage(
        currentPreviewGuest
      );

    try {

      await copyText(
        message
      );

      showToast(
        "邀请已复制，请打开微信发送"
      );

    } catch {

      showToast(
        "复制失败，请长按文字复制"
      );

    }
  }


  /*
   * ==========================
   * 手机原生分享
   * iPhone + Android
   * ==========================
   */

  async function shareWechat(
    guestId
  ) {

    const guest =
      guests.find(
        item =>
          Number(item.id) ===
          Number(guestId)
      );

    if (!guest) {

      showToast(
        "找不到这个宾客"
      );

      return;
    }

    const message =
      buildInviteMessage(
        guest
      );

    /*
     * 必须直接在按钮点击事件里调用
     * 不要 setTimeout
     * 不要 await 其他 API
     *
     * Web Share 要求用户激活
     */

    if (
      typeof navigator !== "undefined" &&
      typeof navigator.share === "function"
    ) {

      const shareData = {
        title:
          "邓天澍 & 邹涛｜婚礼邀请",

        text:
          message,

        url:
          guest.link,
      };

      try {

        if (
          typeof navigator.canShare ===
          "function"
        ) {

          const canShare =
            navigator.canShare(
              shareData
            );

          if (!canShare) {
            throw new Error(
              "当前设备不支持该分享内容"
            );
          }
        }

        await navigator.share(
          shareData
        );

        showToast(
          "已打开手机分享面板"
        );

        return;

      } catch (error) {

        /*
         * 用户主动点取消
         * 不提示错误
         */

        if (
          error &&
          error.name ===
            "AbortError"
        ) {

          return;
        }

        console.warn(
          "原生分享失败",
          error
        );
      }
    }

    /*
     * 不支持原生分享
     * 自动 fallback 到复制
     */

    try {

      await copyText(
        message
      );

      showToast(
        "当前手机不支持系统分享，邀请已复制，请打开微信发送"
      );

    } catch {

      alert(
        "当前设备无法使用系统分享，请点击“复制邀请”，再打开微信发送。"
      );

    }
  }


  /*
   * ==========================
   * 复制专属链接
   * ==========================
   */

  async function copyGuestLink(
    guestId
  ) {

    const guest =
      guests.find(
        item =>
          Number(item.id) ===
          Number(guestId)
      );

    if (!guest) return;

    try {

      await copyText(
        guest.link
      );

      showToast(
        "专属链接已复制"
      );

    } catch {

      showToast(
        "复制失败"
      );

    }
  }


  /*
   * ==========================
   * 预览区分享
   * ==========================
   */

  async function sharePreview() {

    if (!currentPreviewGuest) {

      showToast(
        "请先生成邀请"
      );

      return;
    }

    await shareWechat(
      currentPreviewGuest.id
    );
  }


  /*
   * ==========================
   * 标记发送
   * ==========================
   */

  async function toggleSent(
    guestId
  ) {

    const guest =
      guests.find(
        item =>
          Number(item.id) ===
          Number(guestId)
      );

    if (!guest) return;

    const current =
      Number(guest.sent) === 1;

    try {

      await api(
        `/api/admin/guests/${guestId}`,
        {
          method: "PATCH",
          body: {
            sent: !current,
          },
        }
      );

      await loadAll();

      showToast(
        !current
          ? "已标记为已发送"
          : "已标记为未发送"
      );

    } catch (error) {

      showToast(
        error.message
      );

    }
  }


  /*
   * ==========================
   * 删除
   * ==========================
   */

  async function deleteGuest(
    guestId
  ) {

    const guest =
      guests.find(
        item =>
          Number(item.id) ===
          Number(guestId)
      );

    if (!guest) return;

    const confirmed =
      confirm(
        `确定删除「${guest.name}」吗？`
      );

    if (!confirmed) return;

    try {

      await api(
        `/api/admin/guests/${guestId}`,
        {
          method: "DELETE",
        }
      );

      await loadAll();

      showToast(
        "已删除"
      );

    } catch (error) {

      showToast(
        error.message
      );

    }
  }


  /*
   * ==========================
   * 访客留言
   * ==========================
   */

  function renderPublicReplies() {

    const box =
      document.getElementById(
        "publicReplies"
      );

    const publicReplies =
      currentReplies.filter(
        reply =>
          Number(reply.is_public) === 1
      );

    if (!publicReplies.length) {

      box.innerHTML = `
        <div class="empty">
          暂无访客留言
        </div>
      `;

      return;
    }

    box.innerHTML =
      publicReplies
        .map(
          reply => {

            const attendance =
              reply.attendance === "yes"
                ? "参加"
                : "不参加";

            const stay =
              reply.stay === "yes"
                ? "需要住宿"
                : "不需要住宿";

            return `
              <div class="public-item">

                <div class="public-name">
                  ${escapeHtml(
                    reply.guest_name
                  )}
                </div>

                <div>
                  ${attendance}
                  · ${reply.count || 1} 人
                  · ${stay}
                </div>

                ${
                  reply.message
                    ? `
                      <div class="public-message">
                        ${escapeHtml(
                          reply.message
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="public-time">
                  ${formatTime(
                    reply.submitted_at
                  )}
                </div>

              </div>
            `;
          }
        )
        .join("");
  }


  /*
   * ==========================
   * 通用复制
   * ==========================
   */

  async function copyText(
    text
  ) {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        text
      );

      return;
    }

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value = text;

    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";

    textarea.style.top =
      "0";

    textarea.style.opacity =
      "0";

    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    textarea.setSelectionRange(
      0,
      textarea.value.length
    );

    const success =
      document.execCommand(
        "copy"
      );

    document.body.removeChild(
      textarea
    );

    if (!success) {
      throw new Error(
        "复制失败"
      );
    }
  }


  /*
   * ==========================
   * Toast
   * ==========================
   */

  let toastTimer = null;

  function showToast(
    message
  ) {

    const toast =
      document.getElementById(
        "toast"
      );

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        2600
      );
  }


  /*
   * ==========================
   * HTML 转义
   * ==========================
   */

  function escapeHtml(
    value
  ) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /*
   * ==========================
   * 时间
   * ==========================
   */

  function formatTime(
    value
  ) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return date.toLocaleString(
      "zh-CN",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }
    );
  }

</script>
