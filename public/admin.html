<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>婚礼宾客管理｜邓天澍 & 邹涛</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #faf7f2 0%,
          #f7f3ed 100%
        );

      color: #2f2925;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =====================================================
       登录
    ===================================================== */

    .login-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      background: rgba(255,255,255,.92);

      border:
        1px solid
        rgba(93,75,59,.12);

      border-radius: 24px;

      padding: 36px 28px;

      box-shadow:
        0 20px 60px
        rgba(68,52,39,.08);
    }

    .login-kicker {
      text-align: center;

      font-size: 12px;
      letter-spacing: .22em;

      color: #9b8774;

      margin-bottom: 12px;
    }

    .login-title {
      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;
      font-weight: 400;

      margin: 0 0 8px;
    }

    .login-subtitle {
      text-align: center;

      color: #9a8d82;

      font-size: 13px;

      margin-bottom: 28px;
    }

    .field-label {
      display: block;

      font-size: 13px;

      color: #6f6258;

      margin-bottom: 8px;
    }

    .input {
      width: 100%;

      border:
        1px solid
        #ddd4cb;

      background: #fff;

      border-radius: 12px;

      padding: 13px 14px;

      outline: none;
    }

    .input:focus {
      border-color: #b59d88;
    }

    .primary-button {
      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 13px 16px;

      margin-top: 16px;

      color: white;

      background: #6f5a49;
    }

    .primary-button:active {
      transform: translateY(1px);
    }

    .login-error {
      color: #a94d43;

      font-size: 13px;

      margin-top: 12px;

      text-align: center;
    }


    /* =====================================================
       App
    ===================================================== */

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;

      top: 0;

      z-index: 20;

      background:
        rgba(250,247,242,.92);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid
        rgba(91,73,59,.08);
    }

    .topbar-inner {
      max-width: 1100px;

      margin: 0 auto;

      padding: 18px 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;
    }

    .brand-title {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 21px;
    }

    .brand-subtitle {
      font-size: 12px;

      color: #a09287;

      margin-top: 3px;
    }

    .logout-button {
      border:
        1px solid
        #ddd3ca;

      background: #fff;

      color: #6e6259;

      border-radius: 999px;

      padding: 8px 13px;

      font-size: 12px;
    }


    .container {
      width: min(
        1100px,
        calc(100% - 32px)
      );

      margin: 0 auto;

      padding: 28px 0 70px;
    }


    /* =====================================================
       Sender
    ===================================================== */

    .panel {
      background: rgba(255,255,255,.88);

      border:
        1px solid
        rgba(94,76,61,.09);

      border-radius: 20px;

      padding: 22px;

      margin-bottom: 18px;

      box-shadow:
        0 12px 35px
        rgba(72,53,38,.045);
    }

    .panel-title {
      font-size: 14px;

      font-weight: 600;

      margin-bottom: 12px;
    }

    .sender-select {
      width: 100%;

      border:
        1px solid
        #ddd4cc;

      background: white;

      border-radius: 12px;

      padding: 12px 14px;

      color: #4d433d;

      outline: none;
    }


    /* =====================================================
       Stats
    ===================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-bottom: 18px;
    }

    .stat-card {
      appearance: none;

      width: 100%;

      border:
        1px solid
        rgba(94,76,61,.09);

      background:
        rgba(255,255,255,.88);

      border-radius: 18px;

      padding: 18px;

      text-align: left;

      color: #2f2925;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px
        rgba(72,53,38,.06);
    }

    .stat-card.active {
      border-color: #9b816b;

      box-shadow:
        0 0 0 2px
        rgba(155,129,107,.10);
    }

    .stat-label {
      font-size: 12px;

      color: #9b8d82;

      margin-bottom: 7px;
    }

    .stat-number {
      font-family:
        Georgia,
        serif;

      font-size: 30px;

      line-height: 1;
    }


    /* =====================================================
       Add guest
    ===================================================== */

    .add-row {
      display: flex;

      gap: 10px;
    }

    .add-row .input {
      flex: 1;
    }

    .add-button {
      border: 0;

      border-radius: 12px;

      padding: 0 20px;

      background: #6f5a49;

      color: white;

      white-space: nowrap;
    }


    /* =====================================================
       Section header
    ===================================================== */

    .section-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin:
        28px 0
        12px;
    }

    .section-title {
      font-family:
        Georgia,
        serif;

      font-size: 23px;

      font-weight: 400;

      margin: 0;
    }

    .filter-name {
      font-size: 12px;

      color: #9b8d82;
    }


    /* =====================================================
       Guest cards
    ===================================================== */

    .guest-list {
      display: grid;

      gap: 14px;
    }

    .guest-card {
      background: white;

      border:
        1px solid
        rgba(94,76,61,.09);

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 8px 28px
        rgba(72,53,38,.04);
    }

    .guest-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;
    }

    .guest-name {
      font-size: 20px;

      font-weight: 600;
    }

    .guest-created {
      color: #a09389;

      font-size: 11px;

      margin-top: 5px;
    }

    .status {
      flex-shrink: 0;

      border-radius: 999px;

      padding: 5px 9px;

      font-size: 11px;
    }

    .status.sent {
      background: #edf4ed;

      color: #59735c;
    }

    .status.unsent {
      background: #f7eee8;

      color: #9b6f52;
    }

    .guest-link {
      margin-top: 13px;

      padding: 10px 12px;

      border-radius: 10px;

      background: #f8f5f1;

      color: #8b7c70;

      font-size: 11px;

      word-break: break-all;
    }


    /* =====================================================
       Reply
    ===================================================== */

    .reply-box {
      margin-top: 14px;

      border-top:
        1px solid
        #eee7e1;

      padding-top: 14px;
    }

    .reply-title {
      font-size: 12px;

      color: #9a8c81;

      margin-bottom: 8px;
    }

    .reply-line {
      font-size: 13px;

      line-height: 1.7;

      color: #5e5148;
    }

    .reply-message {
      margin-top: 9px;

      padding: 11px 12px;

      background: #faf7f3;

      border-radius: 10px;

      color: #6c5d52;

      font-size: 13px;

      line-height: 1.7;
    }

    .no-reply {
      color: #b1a69d;

      font-size: 12px;
    }


    /* =====================================================
       Guest actions
    ===================================================== */

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 15px;
    }

    .action-button {
      border:
        1px solid
        #ddd4cc;

      background: white;

      color: #63564c;

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 12px;
    }

    .action-button.primary {
      background: #6f5a49;

      border-color: #6f5a49;

      color: white;
    }

    .action-button.danger {
      color: #a2574d;
    }


    /* =====================================================
       Invite preview
    ===================================================== */

    .invite-preview {
      margin-top: 15px;

      padding: 15px;

      background: #faf7f3;

      border-radius: 14px;

      border:
        1px solid
        #eee5de;
    }

    .invite-preview-title {
      font-size: 12px;

      color: #998b80;

      margin-bottom: 8px;
    }

    .invite-text {
      width: 100%;

      min-height: 190px;

      resize: vertical;

      border:
        1px solid
        #e2d8d0;

      border-radius: 10px;

      padding: 12px;

      background: white;

      color: #4d423a;

      line-height: 1.7;

      outline: none;
    }

    .invite-actions {
      display: flex;

      gap: 8px;

      margin-top: 9px;
    }

    .invite-actions button {
      flex: 1;
    }


    /* =====================================================
       Public replies
    ===================================================== */

    .public-list {
      display: grid;

      gap: 12px;
    }

    .public-card {
      background: white;

      border:
        1px solid
        rgba(94,76,61,.09);

      border-radius: 16px;

      padding: 16px;
    }

    .public-head {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 7px;
    }

    .public-name {
      font-weight: 600;
    }

    .public-time {
      font-size: 11px;

      color: #aaa098;
    }

    .public-content {
      font-size: 13px;

      line-height: 1.7;

      color: #62564d;
    }

    .public-tag {
      display: inline-block;

      margin-top: 8px;

      padding: 4px 8px;

      border-radius: 999px;

      background: #f5eee8;

      color: #96735d;

      font-size: 11px;
    }


    /* =====================================================
       Empty
    ===================================================== */

    .empty {
      text-align: center;

      padding: 45px 20px;

      color: #a89c92;

      font-size: 13px;

      background: rgba(255,255,255,.65);

      border-radius: 18px;
    }


    /* =====================================================
       Toast
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      z-index: 100;

      background: #443a34;

      color: white;

      border-radius: 999px;

      padding: 11px 17px;

      font-size: 12px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =====================================================
       Mobile
    ===================================================== */

    @media (max-width: 700px) {

      .topbar-inner {
        padding:
          14px 16px;
      }

      .container {
        width:
          calc(100% - 24px);

        padding-top: 18px;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 26px;
      }

      .add-row {
        flex-direction: column;
      }

      .add-button {
        min-height: 44px;
      }

      .panel {
        padding: 17px;
      }

      .guest-card {
        padding: 15px;
      }

      .actions {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);
      }

      .action-button {
        width: 100%;
      }

      .invite-actions {
        flex-direction: column;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       登录
  ====================================================== -->

  <section
    id="loginPage"
    class="login-page"
  >

    <div class="login-card">

      <div class="login-kicker">
        WEDDING ADMIN
      </div>

      <h1 class="login-title">
        邓天澍 & 邹涛
      </h1>

      <div class="login-subtitle">
        婚礼宾客管理
      </div>

      <label class="field-label">
        管理密码
      </label>

      <input
        id="passwordInput"
        class="input"
        type="password"
        placeholder="请输入管理密码"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="primary-button"
      >
        进入管理
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       后台
  ====================================================== -->

  <main
    id="app"
    class="app hidden"
  >

    <header class="topbar">

      <div class="topbar-inner">

        <div>
          <div class="brand-title">
            邓天澍 & 邹涛
          </div>

          <div class="brand-subtitle">
            婚礼宾客管理
          </div>
        </div>

        <button
          id="logoutButton"
          class="logout-button"
        >
          退出
        </button>

      </div>

    </header>


    <div class="container">


      <!-- =================================================
           发送人
      ================================================== -->

      <section class="panel">

        <div class="panel-title">
          谁来发这条邀请？
        </div>

        <select
          id="senderSelect"
          class="sender-select"
        >

          <option value="groom">
            新郎
          </option>

          <option value="bride">
            新娘
          </option>

          <option value="groomFather">
            新郎爸爸
          </option>

          <option value="groomMother">
            新郎妈妈
          </option>

          <option value="brideFather">
            新娘爸爸
          </option>

          <option value="brideMother">
            新娘妈妈
          </option>

        </select>

      </section>


      <!-- =================================================
           数据统计
      ================================================== -->

      <section class="stats">

        <button
          class="stat-card active"
          data-filter="all"
        >
          <div class="stat-label">
            宾客
          </div>

          <div
            id="totalCount"
            class="stat-number"
          >
            0
          </div>
        </button>


        <button
          class="stat-card"
          data-filter="sent"
        >
          <div class="stat-label">
            已发送
          </div>

          <div
            id="sentCount"
            class="stat-number"
          >
            0
          </div>
        </button>


        <button
          class="stat-card"
          data-filter="replied"
        >
          <div class="stat-label">
            已回复
          </div>

          <div
            id="repliedCount"
            class="stat-number"
          >
            0
          </div>
        </button>


        <button
          class="stat-card"
          data-filter="stay"
        >
          <div class="stat-label">
            需要住宿
          </div>

          <div
            id="stayCount"
            class="stat-number"
          >
            0
          </div>
        </button>

      </section>


      <!-- =================================================
           添加宾客
      ================================================== -->

      <section class="panel">

        <div class="panel-title">
          添加宾客
        </div>

        <div class="add-row">

          <input
            id="guestNameInput"
            class="input"
            type="text"
            placeholder="例如：邹小明"
          >

          <button
            id="addGuestButton"
            class="add-button"
          >
            添加宾客
          </button>

        </div>

      </section>


      <!-- =================================================
           宾客
      ================================================== -->

      <div class="section-header">

        <h2
          id="guestSectionTitle"
          class="section-title"
        >
          全部宾客
        </h2>

        <div
          id="filterName"
          class="filter-name"
        >
          共 0 人
        </div>

      </div>


      <section
        id="guestList"
        class="guest-list"
      ></section>


      <!-- =================================================
           未提前添加的访客留言
      ================================================== -->

      <div class="section-header">

        <h2 class="section-title">
          访客留言
        </h2>

        <div
          id="publicReplyCount"
          class="filter-name"
        >
          0 条
        </div>

      </div>


      <section
        id="publicList"
        class="public-list"
      ></section>

    </div>

  </main>


  <div
    id="toast"
    class="toast"
  ></div>


<script>

  /* =====================================================
     状态
  ====================================================== */

  let token = "";

  let currentGuests = [];

  let currentReplies = [];

  let currentFilter = "all";


  /* =====================================================
     DOM
  ====================================================== */

  const loginPage =
    document.getElementById("loginPage");

  const app =
    document.getElementById("app");

  const passwordInput =
    document.getElementById("passwordInput");

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");

  const logoutButton =
    document.getElementById("logoutButton");

  const senderSelect =
    document.getElementById("senderSelect");

  const guestNameInput =
    document.getElementById("guestNameInput");

  const addGuestButton =
    document.getElementById("addGuestButton");

  const guestList =
    document.getElementById("guestList");

  const publicList =
    document.getElementById("publicList");

  const totalCount =
    document.getElementById("totalCount");

  const sentCount =
    document.getElementById("sentCount");

  const repliedCount =
    document.getElementById("repliedCount");

  const stayCount =
    document.getElementById("stayCount");

  const guestSectionTitle =
    document.getElementById("guestSectionTitle");

  const filterName =
    document.getElementById("filterName");

  const publicReplyCount =
    document.getElementById("publicReplyCount");

  const toast =
    document.getElementById("toast");


  /* =====================================================
     登录状态
  ====================================================== */

  const savedToken =
    sessionStorage.getItem(
      "wedding_admin_token"
    );

  if (savedToken) {
    token = savedToken;

    showApp();

    loadAll();
  }


  /* =====================================================
     登录
  ====================================================== */

  loginButton.addEventListener(
    "click",
    login
  );

  passwordInput.addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        login();
      }
    }
  );


  async function login() {

    const password =
      passwordInput.value.trim();

    if (!password) {
      loginError.textContent =
        "请输入管理密码";

      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "正在进入…";

    loginError.textContent = "";

    try {

      const response =
        await fetch(
          "/api/admin/guests",
          {
            headers: {
              Authorization:
                `Bearer ${password}`,
            },
          }
        );

      const result =
        await response.json();

      if (
        !response.ok ||
        !result.success
      ) {
        throw new Error(
          result.error ||
          "密码错误"
        );
      }

      token = password;

      sessionStorage.setItem(
        "wedding_admin_token",
        token
      );

      showApp();

      await loadAll();

    } catch (error) {

      loginError.textContent =
        error.message ||
        "登录失败";

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "进入管理";
    }
  }


  function showApp() {

    loginPage.classList.add(
      "hidden"
    );

    app.classList.remove(
      "hidden"
    );
  }


  /* =====================================================
     退出
  ====================================================== */

  logoutButton.addEventListener(
    "click",
    () => {

      sessionStorage.removeItem(
        "wedding_admin_token"
      );

      token = "";

      app.classList.add(
        "hidden"
      );

      loginPage.classList.remove(
        "hidden"
      );

      passwordInput.value = "";
    }
  );


  /* =====================================================
     API
  ====================================================== */

  async function api(
    path,
    options = {}
  ) {

    const response =
      await fetch(
        path,
        {
          ...options,

          headers: {
            ...(options.headers || {}),

            Authorization:
              `Bearer ${token}`,

            "Content-Type":
              "application/json",
          },
        }
      );

    let result = null;

    try {
      result =
        await response.json();
    } catch {
      result = {};
    }

    if (!response.ok) {

      if (response.status === 401) {

        sessionStorage.removeItem(
          "wedding_admin_token"
        );

        token = "";

        app.classList.add(
          "hidden"
        );

        loginPage.classList.remove(
          "hidden"
        );
      }

      throw new Error(
        result.error ||
        `请求失败：${response.status}`
      );
    }

    return result;
  }


  /* =====================================================
     加载全部数据
  ====================================================== */

  async function loadAll() {

    try {

      const [
        guestsResult,
        repliesResult
      ] = await Promise.all([

        api(
          "/api/admin/guests"
        ),

        api(
          "/api/admin/replies"
        ),

      ]);

      currentGuests =
        guestsResult.guests || [];

      currentReplies =
        repliesResult.replies || [];

      updateStats();

      renderGuests();

      renderPublicReplies();

    } catch (error) {

      showToast(
        "加载失败：" +
        error.message
      );
    }
  }


  /* =====================================================
     统计
  ====================================================== */

  function updateStats() {

    const sent =
      currentGuests.filter(
        guest =>
          Number(guest.sent) === 1
      ).length;


    const replied =
      currentReplies.filter(
        reply =>
          reply.attendance === "yes" ||
          reply.attendance === "no"
      ).length;


    const staying =
      currentReplies.filter(
        reply =>
          reply.attendance === "yes" &&
          reply.stay === "yes"
      ).length;


    totalCount.textContent =
      currentGuests.length;

    sentCount.textContent =
      sent;

    repliedCount.textContent =
      replied;

    stayCount.textContent =
      staying;


    publicReplyCount.textContent =
      currentReplies.filter(
        reply =>
          Number(reply.is_public) === 1
      ).length +
      " 条";
  }


  /* =====================================================
     筛选按钮
  ====================================================== */

  document
    .querySelectorAll(".stat-card")
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          currentFilter =
            card.dataset.filter;

          document
            .querySelectorAll(
              ".stat-card"
            )
            .forEach(item => {

              item.classList.toggle(
                "active",
                item.dataset.filter ===
                  currentFilter
              );
            });

          renderGuests();
        }
      );
    });


  /* =====================================================
     根据筛选条件得到宾客
  ====================================================== */

  function getFilteredGuests() {

    if (
      currentFilter === "all"
    ) {
      return currentGuests;
    }


    if (
      currentFilter === "sent"
    ) {
      return currentGuests.filter(
        guest =>
          Number(guest.sent) === 1
      );
    }


    if (
      currentFilter === "replied"
    ) {
      return currentGuests.filter(
        guest =>
          Boolean(
            findReply(guest.id)
          )
      );
    }


    if (
      currentFilter === "stay"
    ) {
      return currentGuests.filter(
        guest => {

          const reply =
            findReply(guest.id);

          return (
            reply &&
            reply.attendance ===
              "yes" &&
            reply.stay ===
              "yes"
          );
        }
      );
    }


    return currentGuests;
  }


  /* =====================================================
     渲染宾客
  ====================================================== */

  function renderGuests() {

    const guests =
      getFilteredGuests();


    const filterTitles = {
      all: "全部宾客",
      sent: "已发送",
      replied: "已回复",
      stay: "需要住宿",
    };


    guestSectionTitle.textContent =
      filterTitles[currentFilter];


    filterName.textContent =
      `共 ${guests.length} 人`;


    if (!guests.length) {

      guestList.innerHTML = `
        <div class="empty">
          这里暂时没有宾客
        </div>
      `;

      return;
    }


    guestList.innerHTML =
      guests
        .map(renderGuestCard)
        .join("");
  }


  /* =====================================================
     单个宾客卡片
  ====================================================== */

  function renderGuestCard(
    guest
  ) {

    const reply =
      findReply(guest.id);


    const sent =
      Number(guest.sent) === 1;


    return `
      <article
        class="guest-card"
        data-id="${guest.id}"
      >

        <div class="guest-top">

          <div>

            <div class="guest-name">
              ${escapeHtml(guest.name)}
            </div>

            <div class="guest-created">
              添加时间：
              ${formatDate(guest.created_at)}
            </div>

          </div>

          <div
            class="status ${
              sent
                ? "sent"
                : "unsent"
            }"
          >
            ${
              sent
                ? "已发送"
                : "未发送"
            }
          </div>

        </div>


        <div class="guest-link">
          ${escapeHtml(guest.link)}
        </div>


        ${
          renderReply(reply)
        }


        <div class="actions">

          <button
            class="action-button primary"
            onclick="showInvite(${guest.id})"
          >
            生成微信邀请
          </button>


          <button
            class="action-button"
            onclick="copyLink(${guest.id})"
          >
            复制链接
          </button>


          <button
            class="action-button"
            onclick="toggleSent(${guest.id})"
          >
            ${
              sent
                ? "标记未发送"
                : "标记已发送"
            }
          </button>


          <button
            class="action-button danger"
            onclick="deleteGuest(${guest.id})"
          >
            删除
          </button>

        </div>


        <div
          id="invite-${guest.id}"
          class="invite-preview hidden"
        >

          <div class="invite-preview-title">
            微信邀请文字
          </div>


          <textarea
            id="invite-text-${guest.id}"
            class="invite-text"
            readonly
          ></textarea>


          <div class="invite-actions">

            <button
              class="action-button primary"
              onclick="copyWechat(${guest.id})"
            >
              复制邀请
            </button>

            <button
              class="action-button"
              onclick="closeInvite(${guest.id})"
            >
              收起
            </button>

          </div>

        </div>

      </article>
    `;
  }


  /* =====================================================
     回复内容
  ====================================================== */

  function renderReply(
    reply
  ) {

    if (!reply) {

      return `
        <div class="reply-box">
          <div class="no-reply">
            暂无回复
          </div>
        </div>
      `;
    }


    const attendance =
      reply.attendance === "yes"
        ? "参加婚礼"
        : "无法参加";


    let html = `
      <div class="reply-box">

        <div class="reply-title">
          RSVP 回复
        </div>

        <div class="reply-line">
          <strong>
            ${escapeHtml(attendance)}
          </strong>
    `;


    if (
      reply.attendance === "yes"
    ) {

      html += `
          · ${reply.count || 1} 人
      `;

      if (
        reply.stay === "yes"
      ) {

        html += `
          · 需要住宿
        `;

      } else if (
        reply.stay === "no"
      ) {

        html += `
          · 不需要住宿
        `;
      }


      if (
        reply.check_in ||
        reply.check_out
      ) {

        html += `
          <br>
          入住：
          ${escapeHtml(
            reply.check_in || "未填写"
          )}

          ·

          离店：
          ${escapeHtml(
            reply.check_out || "未填写"
          )}
        `;
      }

    }


    html += `
        </div>
    `;


    if (reply.message) {

      html += `
        <div class="reply-message">
          ${escapeHtml(reply.message)}
        </div>
      `;
    }


    html += `
        <div
          class="guest-created"
          style="margin-top:8px;"
        >
          ${formatDate(reply.submitted_at)}
        </div>

      </div>
    `;


    return html;
  }


  /* =====================================================
     找回复
  ====================================================== */

  function findReply(
    guestId
  ) {

    return currentReplies.find(
      reply =>
        reply.guest_id !== null &&
        Number(reply.guest_id) ===
          Number(guestId)
    );
  }


  /* =====================================================
     显示邀请
  ====================================================== */

  function showInvite(
    id
  ) {

    const guest =
      findGuest(id);

    if (!guest) return;


    const box =
      document.getElementById(
        `invite-${id}`
      );

    const textarea =
      document.getElementById(
        `invite-text-${id}`
      );


    if (!box || !textarea) {
      return;
    }


    textarea.value =
      getWechatMessage(guest);


    box.classList.remove(
      "hidden"
    );


    box.scrollIntoView({
      behavior: "smooth",
      block: "center",
    });
  }


  function closeInvite(
    id
  ) {

    const box =
      document.getElementById(
        `invite-${id}`
      );

    if (box) {
      box.classList.add(
        "hidden"
      );
    }
  }


  /* =====================================================
     微信邀请文字
  ====================================================== */

  function getWechatMessage(
    guest
  ) {

    const sender =
      senderSelect.value;


    let sentence = "";


    if (
      sender === "groom"
    ) {

      sentence =
        `${guest.name}，诚邀您参加我们的婚礼。`;

    } else if (
      sender === "bride"
    ) {

      sentence =
        `${guest.name}，诚邀您参加我们的婚礼。`;

    } else if (
      sender === "groomFather" ||
      sender === "groomMother"
    ) {

      sentence =
        `${guest.name}，诚邀您参加我儿子邓天澍和儿媳妇邹涛的婚礼。`;

    } else if (
      sender === "brideFather" ||
      sender === "brideMother"
    ) {

      sentence =
        `${guest.name}，诚邀您参加我女儿邹涛和女婿邓天澍的婚礼。`;

    }


    return [
      "邓天澍 & 邹涛｜婚礼邀请",
      "",
      sentence,
      "",
      "2026年10月25日，吉安见。",
      "",
      "👉 点击打开专属请柬：",
      guest.link,
    ].join("\n");
  }


  /* =====================================================
     复制邀请
     
     注意：
     这里绝对不自动标记 sent。
  ====================================================== */

  async function copyWechat(
    id
  ) {

    const guest =
      findGuest(id);

    if (!guest) return;


    const text =
      getWechatMessage(guest);


    try {

      await copyText(text);


      showToast(
        `${guest.name} 的邀请已复制，请到微信粘贴发送。`
      );

    } catch (error) {

      showToast(
        "复制失败：" +
        error.message
      );
    }
  }


  /* =====================================================
     复制链接
  ====================================================== */

  async function copyLink(
    id
  ) {

    const guest =
      findGuest(id);

    if (!guest) return;


    try {

      await copyText(
        guest.link
      );

      showToast(
        "请柬链接已复制"
      );

    } catch (error) {

      showToast(
        "复制失败：" +
        error.message
      );
    }
  }


  /* =====================================================
     复制工具
     
     同时兼容：
     HTTPS clipboard
     老浏览器
     部分微信环境
  ====================================================== */

  async function copyText(
    text
  ) {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        text
      );

      return;
    }


    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value = text;

    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";

    textarea.style.top =
      "0";

    textarea.style.opacity =
      "0";

    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    const success =
      document.execCommand(
        "copy"
      );

    document.body.removeChild(
      textarea
    );


    if (!success) {
      throw new Error(
        "请手动长按文字复制"
      );
    }
  }


  /* =====================================================
     标记发送
     
     这里才真正改变 sent。
  ====================================================== */

  async function toggleSent(
    id
  ) {

    const guest =
      findGuest(id);

    if (!guest) return;


    const currentlySent =
      Number(guest.sent) === 1;


    try {

      await api(
        `/api/admin/guests/${id}`,
        {
          method: "PATCH",

          body: JSON.stringify({
            sent: !currentlySent,
          }),
        }
      );


      showToast(
        currentlySent
          ? "已标记为未发送"
          : "已标记为已发送"
      );


      await loadAll();

    } catch (error) {

      showToast(
        error.message
      );
    }
  }


  /* =====================================================
     添加宾客
  ====================================================== */

  addGuestButton.addEventListener(
    "click",
    addGuest
  );


  guestNameInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        addGuest();
      }

    }
  );


  async function addGuest() {

    const name =
      guestNameInput.value.trim();


    if (!name) {

      showToast(
        "请输入宾客姓名"
      );

      return;
    }


    addGuestButton.disabled =
      true;

    addGuestButton.textContent =
      "添加中…";


    try {

      await api(
        "/api/admin/guests",
        {
          method: "POST",

          body: JSON.stringify({
            name,
          }),
        }
      );


      guestNameInput.value = "";

      currentFilter = "all";


      document
        .querySelectorAll(
          ".stat-card"
        )
        .forEach(card => {

          card.classList.toggle(
            "active",
            card.dataset.filter ===
              "all"
          );

        });


      showToast(
        `${name} 已添加`
      );


      await loadAll();

    } catch (error) {

      showToast(
        error.message
      );

    } finally {

      addGuestButton.disabled =
        false;

      addGuestButton.textContent =
        "添加宾客";
    }
  }


  /* =====================================================
     删除宾客
  ====================================================== */

  async function deleteGuest(
    id
  ) {

    const guest =
      findGuest(id);

    if (!guest) return;


    const confirmed =
      window.confirm(
        `确定删除「${guest.name}」吗？\n\n这个宾客的 RSVP 回复也会一起删除。`
      );


    if (!confirmed) {
      return;
    }


    try {

      await api(
        `/api/admin/guests/${id}`,
        {
          method: "DELETE",
        }
      );


      showToast(
        `${guest.name} 已删除`
      );


      await loadAll();

    } catch (error) {

      showToast(
        error.message
      );
    }
  }


  /* =====================================================
     未提前添加的访客留言
  ====================================================== */

  function renderPublicReplies() {

    const publicReplies =
      currentReplies.filter(
        reply =>
          Number(reply.is_public) === 1
      );


    if (!publicReplies.length) {

      publicList.innerHTML = `
        <div class="empty">
          暂时没有未登记宾客的留言
        </div>
      `;

      return;
    }


    publicList.innerHTML =
      publicReplies
        .map(
          reply => {

            const attendance =
              reply.attendance === "yes"
                ? "参加婚礼"
                : "无法参加";


            const stay =
              reply.attendance === "yes"
                ? (
                    reply.stay === "yes"
                      ? "需要住宿"
                      : "不需要住宿"
                  )
                : "";


            return `
              <article class="public-card">

                <div class="public-head">

                  <div class="public-name">
                    ${escapeHtml(
                      reply.guest_name
                    )}
                  </div>

                  <div class="public-time">
                    ${formatDate(
                      reply.submitted_at
                    )}
                  </div>

                </div>


                <div class="public-content">

                  ${escapeHtml(
                    attendance
                  )}

                  ${
                    stay
                      ? ` · ${escapeHtml(stay)}`
                      : ""
                  }

                  ${
                    reply.count
                      ? ` · ${reply.count} 人`
                      : ""
                  }

                  ${
                    reply.message
                      ? `
                        <div
                          class="reply-message"
                        >
                          ${escapeHtml(
                            reply.message
                          )}
                        </div>
                      `
                      : ""
                  }

                </div>


                <div class="public-tag">
                  未提前登记的访客
                </div>

              </article>
            `;
          }
        )
        .join("");
  }


  /* =====================================================
     工具
  ====================================================== */

  function findGuest(
    id
  ) {

    return currentGuests.find(
      guest =>
        Number(guest.id) ===
        Number(id)
    );
  }


  function formatDate(
    value
  ) {

    if (!value) {
      return "";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }


    return date.toLocaleString(
      "zh-CN",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }
    );
  }


  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function showToast(
    text
  ) {

    toast.textContent =
      text;

    toast.classList.add(
      "show"
    );


    clearTimeout(
      showToast.timer
    );


    showToast.timer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        2600
      );
  }


  /* =====================================================
     发送人切换时，如果邀请框已经打开，重新生成文字
  ====================================================== */

  senderSelect.addEventListener(
    "change",
    () => {

      document
        .querySelectorAll(
          ".guest-card"
        )
        .forEach(card => {

          const id =
            card.dataset.id;

          const box =
            document.getElementById(
              `invite-${id}`
            );

          const textarea =
            document.getElementById(
              `invite-text-${id}`
            );

          if (
            box &&
            textarea &&
            !box.classList.contains(
              "hidden"
            )
          ) {

            const guest =
              findGuest(id);

            if (guest) {

              textarea.value =
                getWechatMessage(
                  guest
                );
            }
          }
        });
    }
  );


</script>

</body>
</html>
