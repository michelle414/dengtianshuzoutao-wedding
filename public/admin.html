<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>邓天澍 & 邹涛｜宾客管理</title>

  <style>
    @font-face {
      font-family: "WeddingChinese";
      src: url("/FZZiLSJW-B.TTF") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "WeddingEnglish";
      src: url("/FZVDLGTMCJW-L.TTF") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ef;
      color: #403831;
      font-family: "WeddingChinese", serif;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(120,100,80,.14);
      border-radius: 18px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(70,50,30,.08);
    }

    .login-en,
    .header-en {
      font-family: "WeddingEnglish", serif;
      letter-spacing: .18em;
      opacity: .55;
    }

    .login-en {
      font-size: 12px;
      margin-bottom: 10px;
    }

    .login-title {
      font-size: 25px;
      font-weight: normal;
      margin: 0 0 28px;
    }

    .login-input,
    .guest-input,
    .sender-select {
      border: 1px solid #d7cec4;
      background: white;
      outline: none;
    }

    .login-input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      padding: 0 14px;
      text-align: center;
      font-size: 15px;
    }

    .login-input:focus,
    .guest-input:focus,
    .sender-select:focus {
      border-color: #9e9082;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #51483f;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: .6;
    }

    .login-error {
      margin-top: 14px;
      min-height: 40px;
      color: #a05252;
      font-size: 13px;
      line-height: 1.6;
    }

    .admin-page {
      display: none;
    }

    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 26px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 15px;
    }

    .header-en {
      font-size: 12px;
      margin-bottom: 7px;
    }

    .header-title {
      font-size: 26px;
      font-weight: normal;
      margin: 0;
    }

    .logout {
      border: 1px solid #d4cbc1;
      background: transparent;
      color: #625950;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .add-card,
    .sender-card {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(120,100,80,.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .add-title,
    .sender-title {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .guest-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border-radius: 9px;
      padding: 0 13px;
      font-size: 15px;
    }

    .add-button {
      height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #51483f;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .message {
      min-height: 20px;
      margin-top: 9px;
      font-size: 13px;
      color: #806f5e;
      line-height: 1.5;
    }

    .sender-desc {
      font-size: 12px;
      color: #8b7f74;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .sender-select {
      width: 100%;
      height: 46px;
      border-radius: 9px;
      padding: 0 12px;
      color: #403831;
      font-size: 14px;
    }

    /* =========================
       可点击统计
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 12px;
    }

    .stat {
      appearance: none;
      text-align: left;
      width: 100%;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(120,100,80,.1);
      border-radius: 12px;
      padding: 12px;
      color: #403831;
      cursor: pointer;
      transition: .18s ease;
    }

    .stat.active {
      background: #51483f;
      color: white;
      border-color: #51483f;
      transform: translateY(-1px);
    }

    .stat-label {
      font-size: 12px;
      opacity: .6;
    }

    .stat.active .stat-label {
      opacity: .78;
    }

    .stat-number {
      margin-top: 3px;
      font-family: "WeddingEnglish", serif;
      font-size: 24px;
    }

    .filter-hint {
      min-height: 24px;
      margin: 0 2px 10px;
      font-size: 12px;
      color: #897d72;
    }

    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 22px 2px 10px;
    }

    .section-label-title {
      font-size: 16px;
    }

    .section-label-en {
      font-family: "WeddingEnglish", serif;
      font-size: 10px;
      letter-spacing: .15em;
      opacity: .45;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(120,100,80,.12);
      border-radius: 15px;
      padding: 17px;
    }

    .guest-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .guest-name {
      font-size: 20px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.sent {
      background: #e8eee7;
      color: #5c7159;
    }

    .status.unsent {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .guest-link {
      margin-top: 9px;
      font-family: "WeddingEnglish", serif;
      font-size: 11px;
      color: #81766d;
      word-break: break-all;
      line-height: 1.5;
      opacity: .8;
    }

    .reply-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #faf8f4;
      border: 1px solid #eee8df;
    }

    .reply-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .reply-status.replied {
      background: #e8eee7;
      color: #5c7159;
    }

    .reply-status.waiting {
      background: #f1ebe4;
      color: #7d6d5e;
    }

    .reply-detail {
      font-size: 13px;
      line-height: 1.8;
      color: #5c544d;
    }

    .reply-detail strong {
      font-weight: normal;
      color: #403831;
    }

    .reply-message {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #e9e2d9;
      color: #766b62;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reply-more {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #ddd5cb;
    }

    .reply-more-title {
      font-size: 12px;
      color: #8a7d72;
      margin-bottom: 8px;
    }

    .reply-mini {
      padding: 10px 0;
      border-top: 1px solid #eee8df;
    }

    .reply-mini:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .reply-mini-status {
      font-size: 12px;
      color: #5c7159;
      margin-bottom: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      min-height: 42px;
      border: 1px solid #d8d0c6;
      background: white;
      color: #5c544d;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 10px;
    }

    .actions .primary {
      background: #51483f;
      color: white;
      border-color: #51483f;
    }

    .actions .delete {
      grid-column: 1 / -1;
      background: transparent;
      border-color: transparent;
      color: #a05252;
      min-height: 34px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #8c8177;
      font-size: 14px;
    }

    .invite-preview {
      margin-top: 14px;
      padding: 14px;
      background: #faf8f4;
      border: 1px solid #eee8df;
      border-radius: 12px;
    }

    .invite-preview-title {
      font-size: 12px;
      color: #8a7d72;
      margin-bottom: 8px;
    }

    .invite-preview-text {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid #ddd5cb;
      border-radius: 9px;
      background: white;
      padding: 12px;
      color: #51483f;
      font-size: 13px;
      line-height: 1.7;
      outline: none;
    }

    .invite-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .invite-preview-actions button {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #d8d0c6;
      background: white;
      color: #5c544d;
      cursor: pointer;
      font-size: 13px;
    }

    .invite-preview-actions .main-copy {
      background: #51483f;
      border-color: #51483f;
      color: white;
    }

    @media (max-width: 620px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 22px 14px 40px;
      }

      .add-row {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .header-title {
        font-size: 23px;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .actions .primary {
        grid-column: 1 / -1;
      }

      .actions .delete {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

<section class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-en">WEDDING ADMIN</div>

    <h1 class="login-title">
      宾客管理
    </h1>

    <input
      id="passwordInput"
      class="login-input"
      type="password"
      placeholder="请输入管理员密码"
      autocomplete="current-password"
    />

    <button
      id="loginButton"
      class="login-button"
    >
      进入管理页面
    </button>

    <div
      id="loginError"
      class="login-error"
    ></div>
  </div>
</section>


<section
  id="adminPage"
  class="admin-page"
>
  <div class="page">

    <header class="header">
      <div>
        <div class="header-en">
          TIANSHU & TAO
        </div>

        <h1 class="header-title">
          宾客管理
        </h1>
      </div>

      <button
        id="logoutButton"
        class="logout"
      >
        退出
      </button>
    </header>


    <div class="add-card">

      <div class="add-title">
        添加宾客
      </div>

      <div class="add-row">

        <input
          id="guestNameInput"
          class="guest-input"
          type="text"
          placeholder="输入宾客姓名，例如：邹小明"
        />

        <button
          id="addGuestButton"
          class="add-button"
        >
          添加宾客
        </button>

      </div>

      <div
        id="message"
        class="message"
      ></div>

    </div>


    <div class="sender-card">

      <div class="sender-title">
        谁来发这份邀请？
      </div>

      <div class="sender-desc">
        选择后，系统会自动生成适合这个身份的微信邀请文案。
      </div>

      <select
        id="senderSelect"
        class="sender-select"
      >
        <option value="groom">
          新郎 · 邓天澍
        </option>

        <option value="bride">
          新娘 · 邹涛
        </option>

        <option value="groomFather">
          新郎爸爸
        </option>

        <option value="groomMother">
          新郎妈妈
        </option>

        <option value="brideFather">
          新娘爸爸
        </option>

        <option value="brideMother">
          新娘妈妈
        </option>
      </select>

    </div>


    <div class="stats">

      <button
        class="stat active"
        data-filter="all"
        id="filterAll"
      >
        <div class="stat-label">
          全部
        </div>

        <div
          id="totalCount"
          class="stat-number"
        >
          0
        </div>
      </button>


      <button
        class="stat"
        data-filter="sent"
        id="filterSent"
      >
        <div class="stat-label">
          已发送
        </div>

        <div
          id="sentCount"
          class="stat-number"
        >
          0
        </div>
      </button>


      <button
        class="stat"
        data-filter="replied"
        id="filterReplied"
      >
        <div class="stat-label">
          已回复
        </div>

        <div
          id="repliedCount"
          class="stat-number"
        >
          0
        </div>
      </button>


      <button
        class="stat"
        data-filter="stay"
        id="filterStay"
      >
        <div class="stat-label">
          需要住宿
        </div>

        <div
          id="stayCount"
          class="stat-number"
        >
          0
        </div>
      </button>

    </div>


    <div
      id="filterHint"
      class="filter-hint"
    >
      当前显示：全部宾客
    </div>


    <div class="section-label">

      <div class="section-label-title">
        宾客列表
      </div>

      <div class="section-label-en">
        GUESTS
      </div>

    </div>


    <div
      id="guestList"
      class="guest-list"
    >
      <div class="loading">
        正在加载……
      </div>
    </div>

  </div>
</section>


<script>

const TOKEN_KEY =
  "wedding_admin_password";

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const passwordInput =
  document.getElementById("passwordInput");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const guestNameInput =
  document.getElementById("guestNameInput");

const addGuestButton =
  document.getElementById("addGuestButton");

const message =
  document.getElementById("message");

const guestList =
  document.getElementById("guestList");

const totalCount =
  document.getElementById("totalCount");

const sentCount =
  document.getElementById("sentCount");

const repliedCount =
  document.getElementById("repliedCount");

const stayCount =
  document.getElementById("stayCount");

const logoutButton =
  document.getElementById("logoutButton");

const senderSelect =
  document.getElementById("senderSelect");

const filterHint =
  document.getElementById("filterHint");

let currentGuests = [];
let currentReplies = [];
let currentFilter = "all";


/* =========================
   登录
========================= */

function showLogin() {
  loginPage.style.display = "flex";
  adminPage.style.display = "none";
  passwordInput.focus();
}

function showAdmin() {
  loginPage.style.display = "none";
  adminPage.style.display = "block";
}


/* =========================
   API
========================= */

async function api(
  endpoint,
  options = {}
) {

  const password =
    sessionStorage.getItem(
      TOKEN_KEY
    );

  const headers = {
    ...(options.headers || {}),
    Authorization:
      `Bearer ${password || ""}`
  };

  if (options.body) {
    headers["Content-Type"] =
      "application/json";
  }

  let response;

  try {

    response = await fetch(
      endpoint,
      {
        ...options,
        headers
      }
    );

  } catch (error) {

    throw new Error(
      "网络连接失败：" +
      error.message
    );
  }

  let data;

  try {

    data =
      await response.json();

  } catch {

    throw new Error(
      `服务器返回异常（HTTP ${response.status}）`
    );
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      `请求失败（HTTP ${response.status}）`
    );
  }

  if (data.success === false) {

    throw new Error(
      data.error ||
      "服务器操作失败"
    );
  }

  return data;
}


/* =========================
   登录
========================= */

async function login() {

  const password =
    passwordInput.value.trim();

  if (!password) {

    loginError.textContent =
      "请输入密码";

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent =
    "验证中……";

  loginError.textContent = "";

  sessionStorage.setItem(
    TOKEN_KEY,
    password
  );

  try {

    await loadAll();

    showAdmin();

    passwordInput.value = "";

  } catch (error) {

    sessionStorage.removeItem(
      TOKEN_KEY
    );

    loginError.textContent =
      "错误：" +
      error.message;

  } finally {

    loginButton.disabled = false;

    loginButton.textContent =
      "进入管理页面";
  }
}


/* =========================
   加载
========================= */

async function loadAll() {

  await Promise.all([
    loadGuests(),
    loadReplies()
  ]);

  renderStats();

  renderGuests();
}


async function loadGuests() {

  const data =
    await api(
      "/api/admin/guests",
      {
        method: "GET"
      }
    );

  currentGuests =
    data.guests || [];
}


async function loadReplies() {

  const data =
    await api(
      "/api/admin/replies",
      {
        method: "GET"
      }
    );

  currentReplies =
    data.replies || [];
}


/* =========================
   回复工具
========================= */

function getRepliesForGuest(
  guest
) {

  return currentReplies.filter(
    reply =>
      Number(reply.guest_id) ===
      Number(guest.id)
  );
}


function hasReply(guest) {

  return getRepliesForGuest(
    guest
  ).length > 0;
}


function needsStay(guest) {

  return getRepliesForGuest(
    guest
  ).some(
    reply =>
      reply.attendance === "yes" &&
      reply.stay === "yes"
  );
}


/* =========================
   统计
========================= */

function renderStats() {

  const sent =
    currentGuests.filter(
      guest =>
        Number(guest.sent) === 1
    ).length;

  const replied =
    currentGuests.filter(
      guest =>
        hasReply(guest)
    ).length;

  const staying =
    currentGuests.filter(
      guest =>
        needsStay(guest)
    ).length;

  totalCount.textContent =
    currentGuests.length;

  sentCount.textContent =
    sent;

  repliedCount.textContent =
    replied;

  stayCount.textContent =
    staying;
}


/* =========================
   筛选
========================= */

function applyFilter(
  filter
) {

  currentFilter = filter;

  document
    .querySelectorAll(".stat")
    .forEach(item => {

      item.classList.toggle(
        "active",
        item.dataset.filter ===
          filter
      );
    });

  const labels = {
    all: "全部宾客",
    sent: "已经发送邀请的宾客",
    replied: "已经回复的宾客",
    stay: "需要住宿的宾客"
  };

  filterHint.textContent =
    `当前显示：${
      labels[filter]
    }`;

  renderGuests();
}


function getFilteredGuests() {

  if (
    currentFilter ===
    "sent"
  ) {

    return currentGuests.filter(
      guest =>
        Number(guest.sent) === 1
    );
  }

  if (
    currentFilter ===
    "replied"
  ) {

    return currentGuests.filter(
      guest =>
        hasReply(guest)
    );
  }

  if (
    currentFilter ===
    "stay"
  ) {

    return currentGuests.filter(
      guest =>
        needsStay(guest)
    );
  }

  return currentGuests;
}


/* =========================
   回复显示
========================= */

function renderReply(
  guest
) {

  const replies =
    getRepliesForGuest(
      guest
    );

  if (!replies.length) {

    return `
      <div class="reply-box">

        <div class="reply-status waiting">
          尚未回复
        </div>

        <div class="reply-detail">
          等待宾客填写宾客回复。
        </div>

      </div>
    `;
  }

  const first =
    replies[0];

  const renderOne =
    reply => {

      if (
        reply.attendance ===
        "no"
      ) {

        return `
          <div class="reply-mini">

            <div class="reply-mini-status">
              已回复 · 无法出席
            </div>

            ${
              reply.message
                ? `
                  <div class="reply-message">
                    ${escapeHtml(
                      reply.message
                    )}
                  </div>
                `
                : ""
            }

          </div>
        `;
      }

      return `
        <div class="reply-mini">

          <div class="reply-mini-status">
            已回复 · 会出席
          </div>

          <div class="reply-detail">

            <strong>人数：</strong>
            ${
              Number(reply.count) || 1
            } 人

            <br>

            <strong>住宿：</strong>
            ${
              reply.stay === "yes"
                ? "需要住宿"
                : "不需要住宿"
            }

            ${
              reply.stay === "yes"
                ? `
                  <br>
                  <strong>入住：</strong>
                  ${
                    escapeHtml(
                      reply.check_in ||
                      "未填写"
                    )
                  }

                  <br>

                  <strong>退房：</strong>
                  ${
                    escapeHtml(
                      reply.check_out ||
                      "未填写"
                    )
                  }
                `
                : ""
            }

          </div>

          ${
            reply.message
              ? `
                <div class="reply-message">
                  ${escapeHtml(
                    reply.message
                  )}
                </div>
              `
              : ""
          }

        </div>
      `;
    };


  const firstHtml =
    renderOne(first);

  if (replies.length === 1) {

    return `
      <div class="reply-box">

        <div class="reply-status replied">
          已回复
        </div>

        ${firstHtml}

      </div>
    `;
  }


  return `
    <div class="reply-box">

      <div class="reply-status replied">
        已回复 · ${replies.length} 条
      </div>

      ${firstHtml}

      <div class="reply-more">

        <div class="reply-more-title">
          还有 ${replies.length - 1} 条回复
        </div>

        ${replies
          .slice(1)
          .map(renderOne)
          .join("")}

      </div>

    </div>
  `;
}


/* =========================
   渲染宾客
========================= */

function renderGuests() {

  const guests =
    getFilteredGuests();

  if (!guests.length) {

    guestList.innerHTML = `
      <div class="empty">
        这个分类暂时没有宾客
      </div>
    `;

    return;
  }

  guestList.innerHTML =
    guests
      .map(
        guest => {

          const isSent =
            Number(guest.sent) === 1;

          return `
            <div class="guest-card">

              <div class="guest-top">

                <div class="guest-name">
                  ${escapeHtml(
                    guest.name
                  )}
                </div>

                <div
                  class="status ${
                    isSent
                      ? "sent"
                      : "unsent"
                  }"
                >
                  ${
                    isSent
                      ? "已发送"
                      : "未发送"
                  }
                </div>

              </div>

              <div class="guest-link">
                ${escapeHtml(
                  guest.link
                )}
              </div>

              ${renderReply(guest)}

              <div class="actions">

                <button
                  class="primary"
                  onclick="openInvite(${guest.id})"
                >
                  生成微信邀请
                </button>

                <button
                  onclick="copyLink(${guest.id})"
                >
                  复制链接
                </button>

                <button
                  onclick="toggleSent(
                    ${guest.id},
                    ${isSent}
                  )"
                >
                  ${
                    isSent
                      ? "标记未发送"
                      : "标记已发送"
                  }
                </button>

                <button
                  class="delete"
                  onclick="deleteGuest(
                    ${guest.id}
                  )"
                >
                  删除这位宾客
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================
   安全处理
========================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   添加宾客
========================= */

async function addGuest() {

  const name =
    guestNameInput.value.trim();

  if (!name) {

    message.textContent =
      "请输入宾客姓名";

    return;
  }

  addGuestButton.disabled =
    true;

  addGuestButton.textContent =
    "添加中……";

  try {

    await api(
      "/api/admin/guests",
      {
        method: "POST",
        body: JSON.stringify({
          name
        })
      }
    );

    guestNameInput.value = "";

    message.textContent =
      `${name} 已添加，可以生成专属微信邀请`;

    await loadAll();

  } catch (error) {

    message.textContent =
      "错误：" +
      error.message;

  } finally {

    addGuestButton.disabled =
      false;

    addGuestButton.textContent =
      "添加宾客";
  }
}


/* =========================
   查找宾客
========================= */

function findGuest(id) {

  return currentGuests.find(
    guest =>
      Number(guest.id) ===
      Number(id)
  );
}


/* =========================
   微信文案
========================= */

function getWechatMessage(
  guest
) {

  const sender =
    senderSelect.value;

  let sentence = "";

  if (
    sender === "groom" ||
    sender === "bride"
  ) {

    sentence =
      `${guest.name}，诚邀您参加我们的婚礼。`;

  } else if (
    sender === "groomFather" ||
    sender === "groomMother"
  ) {

    sentence =
      `${guest.name}，诚邀您参加我儿子邓天澍和儿媳妇邹涛的婚礼。`;

  } else if (
    sender === "brideFather" ||
    sender === "brideMother"
  ) {

    sentence =
      `${guest.name}，诚邀您参加我女儿邹涛和女婿邓天澍的婚礼。`;
  }

  return `邓天澍 & 邹涛｜婚礼邀请

${sentence}

2026年10月25日，吉安见。

👉 点击打开专属请柬：
${guest.link}`;
}


/* =========================
   打开邀请
========================= */

function openInvite(id) {

  const guest =
    findGuest(id);

  if (!guest) return;

  const existing =
    document.getElementById(
      `invite-${guest.id}`
    );

  if (existing) {

    existing.remove();

    return;
  }

  const card =
    document
      .querySelector(
        `.guest-card button[onclick="openInvite(${guest.id})"]`
      )
      ?.closest(
        ".guest-card"
      );

  if (!card) return;

  const preview =
    document.createElement(
      "div"
    );

  preview.id =
    `invite-${guest.id}`;

  preview.className =
    "invite-preview";

  preview.innerHTML = `
    <div class="invite-preview-title">
      当前发送人：
      ${escapeHtml(
        senderSelect.options[
          senderSelect.selectedIndex
        ].text
      )}
    </div>

    <textarea
      class="invite-preview-text"
      readonly
    ></textarea>

    <div class="invite-preview-actions">

      <button
        class="main-copy"
        onclick="copyWechat(${guest.id})"
      >
        复制邀请
      </button>

      <button
        onclick="closeInvite(${guest.id})"
      >
        收起
      </button>

    </div>
  `;

  card.appendChild(
    preview
  );

  preview.querySelector(
    ".invite-preview-text"
  ).value =
    getWechatMessage(guest);
}


function closeInvite(id) {

  const preview =
    document.getElementById(
      `invite-${id}`
    );

  if (preview) {
    preview.remove();
  }
}


/* =========================
   复制邀请
   注意：
   这里只复制
   不自动标记已发送
========================= */

async function copyWechat(
  id
) {

  const guest =
    findGuest(id);

  if (!guest) return;

  const text =
    getWechatMessage(guest);

  try {

    await navigator.clipboard.writeText(
      text
    );

    message.textContent =
      `${guest.name} 的邀请已复制，请打开微信粘贴发送。`;

  } catch (error) {

    message.textContent =
      "自动复制失败，请在邀请框内长按并复制。";
  }
}


/* =========================
   复制链接
========================= */

async function copyLink(
  id
) {

  const guest =
    findGuest(id);

  if (!guest) return;

  try {

    await navigator.clipboard.writeText(
      guest.link
    );

    message.textContent =
      `${guest.name} 的专属请柬链接已复制`;

  } catch {

    message.textContent =
      "复制失败，请手动复制链接";
  }
}


/* =========================
   修改发送状态
========================= */

async function toggleSent(
  id,
  current
) {

  try {

    await api(
      `/api/admin/guests/${id}`,
      {
        method: "PATCH",
        body: JSON.stringify({
          sent: !current
        })
      }
    );

    message.textContent =
      !current
        ? "已标记为已发送"
        : "已标记为未发送";

    await loadAll();

  } catch (error) {

    message.textContent =
      "错误：" +
      error.message;
  }
}


/* =========================
   删除
========================= */

async function deleteGuest(
  id
) {

  const guest =
    findGuest(id);

  if (!guest) return;

  if (
    !confirm(
      `确定要删除「${guest.name}」吗？\n\n这个宾客的回复和住宿信息也会一起删除。`
    )
  ) {

    return;
  }

  try {

    await api(
      `/api/admin/guests/${id}`,
      {
        method: "DELETE"
      }
    );

    message.textContent =
      `${guest.name} 已删除`;

    await loadAll();

  } catch (error) {

    message.textContent =
      "错误：" +
      error.message;
  }
}


/* =========================
   发送人改变
========================= */

senderSelect.addEventListener(
  "change",
  () => {

    const previews =
      document.querySelectorAll(
        ".invite-preview"
      );

    previews.forEach(
      preview => {

        const id =
          Number(
            preview.id.replace(
              "invite-",
              ""
            )
          );

        const guest =
          findGuest(id);

        if (!guest) return;

        const textarea =
          preview.querySelector(
            ".invite-preview-text"
          );

        const title =
          preview.querySelector(
            ".invite-preview-title"
          );

        if (textarea) {

          textarea.value =
            getWechatMessage(
              guest
            );
        }

        if (title) {

          title.textContent =
            `当前发送人：${
              senderSelect.options[
                senderSelect.selectedIndex
              ].text
            }`;
        }
      }
    );
  }
);


/* =========================
   筛选按钮
========================= */

document
  .querySelectorAll(".stat")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          applyFilter(
            button.dataset.filter
          );

        }
      );
    }
  );


/* =========================
   退出
========================= */

function logout() {

  sessionStorage.removeItem(
    TOKEN_KEY
  );

  showLogin();

  loginError.textContent = "";
}


/* =========================
   事件
========================= */

loginButton.addEventListener(
  "click",
  login
);

passwordInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {
      login();
    }

  }
);

addGuestButton.addEventListener(
  "click",
  addGuest
);

guestNameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {
      addGuest();
    }

  }
);

logoutButton.addEventListener(
  "click",
  logout
);


/* =========================
   自动登录
========================= */

const savedPassword =
  sessionStorage.getItem(
    TOKEN_KEY
  );

if (savedPassword) {

  loadAll()
    .then(() => {

      showAdmin();

    })
    .catch(error => {

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      showLogin();

      loginError.textContent =
        "错误：" +
        error.message;
    });

} else {

  showLogin();
}

</script>
